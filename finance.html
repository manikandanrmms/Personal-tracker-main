<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MoneyFlow — Personal Budget Tracker</title><rect width="100" height="100" rx="16" fill="#1C2B3A"/><text x="50" y="66" font-size="55" text-anchor="middle" fill="#EAE3D0">₹</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #F6F7F3; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ------------------------------------------------------------------ */
/*  Design: "MoneyFlow" — a ledger / bank-passbook aesthetic.      */
/* ------------------------------------------------------------------ */

const INK = '#151112';
const INK_SOFT = '#6D7275';
const PAPER = '#F5F8FC';
const PAPER_LINE = '#E6EBF1';
const CARD = '#FFFFFF';
const BRASS = '#2748B9';
const GOOD = '#3C8B6A';
const BAD = '#BD3C2B';
const WARN = '#BD8B90';
const STITCH = '#E1E7EF';

const STORAGE_KEY = 'moneyflow-budget-v1';

const DEFAULT_CATEGORIES = [
  { id: 'housing', name: 'Housing', color: INK },
  { id: 'food', name: 'Food', color: BAD },
  { id: 'transport', name: 'Transport', color: GOOD },
  { id: 'utilities', name: 'Utilities', color: BRASS },
  { id: 'entertainment', name: 'Entertainment', color: '#6B4E9E' },
  { id: 'health', name: 'Health', color: '#2A6F8E' },
  { id: 'savings', name: 'Savings', color: '#3E7C5A' },
  { id: 'other', name: 'Other', color: '#7A7264' },
];

const DEFAULT_REMINDERS = [
  { id: 'r-review', label: 'Review this month\u2019s budget', frequency: 'monthly', completed: {} },
  { id: 'r-update', label: 'Enter / update expenses', frequency: 'monthly', completed: {} },
  { id: 'r-cc', label: 'Check credit-card payments', frequency: 'monthly', completed: {} },
  { id: 'r-qreview', label: 'Review quarterly spending', frequency: 'quarterly', completed: {} },
  { id: 'r-qsavings', label: 'Review savings performance', frequency: 'quarterly', completed: {} },
  { id: 'r-qadjust', label: 'Adjust next-quarter budget', frequency: 'quarterly', completed: {} },
];

const TABS = ['Dashboard', 'Transactions', 'Monthly Budget', 'Quarterly Review', 'Categories', 'Goals', 'Reminders'];

/* ---------------------------- helpers ------------------------------ */

const fmt = (n) => '\u20B9' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const pad2 = (n) => String(n).padStart(2, '0');
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
};
const currentMonthKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
};
const monthLabel = (key) => {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('en-IN', { month: 'long', year: 'numeric' });
};
const monthShort = (key) => {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('en-IN', { month: 'short', year: '2-digit' });
};
const shiftMonth = (key, delta) => {
  let [y, m] = key.split('-').map(Number);
  m += delta;
  while (m < 1) { m += 12; y -= 1; }
  while (m > 12) { m -= 12; y += 1; }
  return `${y}-${pad2(m)}`;
};
const quarterKeyFromMonth = (key) => {
  const [y, m] = key.split('-').map(Number);
  return `${y}-Q${Math.ceil(m / 3)}`;
};
const monthsInQuarter = (qkey) => {
  const [y, q] = qkey.split('-Q').map(Number);
  const startM = (q - 1) * 3 + 1;
  return [0, 1, 2].map((i) => `${y}-${pad2(startM + i)}`);
};
const shiftQuarter = (qkey, delta) => {
  let [y, q] = qkey.split('-Q').map(Number);
  q += delta;
  while (q < 1) { q += 4; y -= 1; }
  while (q > 4) { q -= 4; y += 1; }
  return `${y}-Q${q}`;
};
const quarterLabel = (qkey) => {
  const [y, q] = qkey.split('-Q');
  return `Q${q} ${y}`;
};
const lastDayOfMonth = (y, m1) => new Date(y, m1, 0);
const daysBetween = (a, b) => Math.ceil((a - b) / 86400000);

function statusOf(budget, actual) {
  if (!budget || budget <= 0) return actual > 0 ? 'unbudgeted' : 'ontrack';
  const pct = (actual / budget) * 100;
  if (pct > 100) return 'over';
  if (pct >= 90) return 'near';
  return 'ontrack';
}
const statusMeta = {
  ontrack: { label: 'On Track', color: GOOD },
  near: { label: 'Near Limit', color: WARN },
  over: { label: 'Over Budget', color: BAD },
  unbudgeted: { label: 'Unbudgeted', color: INK_SOFT },
};

/* ------------------------- Firebase cloud I/O ------------------------- */

function legacyLoadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

async function loadFromStorage() {
  try {
    const parent = window.parent;
    const C = parent && parent.Cloud;
    if (!C) return null;

    // Wait for the parent application to finish restoring Firebase Auth.
    if (C.ready && typeof C.ready.then === 'function') {
      try { await Promise.race([C.ready, new Promise(r => setTimeout(r, 8000))]); } catch (_) {}
    }

    const uid = typeof C.getCurrentUid === 'function' ? C.getCurrentUid() : null;
    if (!uid || typeof C.getItemSafe !== 'function') return null;

    // Never leave the Finance tab on the loading screen indefinitely.
    const readPromise = C.getItemSafe('finance');
    const result = await Promise.race([
      readPromise,
      new Promise(resolve => setTimeout(() => resolve({ ok: false, exists: false, value: null, timeout: true }), 8000))
    ]);

    if (!result || !result.ok) {
      console.warn('Finance Firebase read unavailable; keeping local/default data.');
      return legacyLoadFromStorage();
    }
    if (result.exists && result.value) return result.value;

    // One-time migration from previous browser-local Finance data.
    const legacy = legacyLoadFromStorage();
    if (legacy) {
      try { await C.setItem('finance', legacy, { uid }); } catch (_) {}
      return legacy;
    }
    return null;
  } catch (e) {
    console.warn('Finance Firebase load failed:', e);
    return legacyLoadFromStorage();
  }
}

function saveToStorage(data) {
  try {
    const C = window.parent && window.parent.Cloud;
    if (!C || typeof C.getCurrentUid !== 'function' || !C.getCurrentUid()) return;
    C.scheduleSave('finance', () => data, 500);
  } catch (e) {
    console.warn('Finance Firebase save failed:', e);
  }
}

/* --------------------------- small UI bits -------------------------- */

function StampBadge({ status }) {
  const meta = statusMeta[status] || statusMeta.ontrack;
  return <span className="stamp" style={{ color: meta.color, borderColor: meta.color }}>{meta.label}</span>;
}

function ProgressBar({ pct, color }) {
  const clamped = Math.max(0, Math.min(100, pct));
  return (
    <div className="w-full h-3 rounded-full overflow-hidden" style={{ background: PAPER_LINE }}>
      <div className="h-full rounded-full transition-all duration-700 ease-out"
        style={{ width: `${clamped}%`, background: color || (pct > 100 ? BAD : pct >= 90 ? WARN : GOOD) }} />
    </div>
  );
}

function LedgerCard({ children, className = '' }) {
  return <div className={`ledger-card ${className}`}>{children}</div>;
}

function SectionTitle({ eyebrow, title, right }) {
  return (
    <div className="flex items-end justify-between mb-4 flex-wrap gap-3">
      <div>
        {eyebrow && <div className="eyebrow">{eyebrow}</div>}
        <h2 className="section-title">{title}</h2>
      </div>
      {right}
    </div>
  );
}

function IconBtn({ onClick, children, title }) {
  return (
    <button onClick={onClick} title={title}
      className="w-8 h-8 rounded-full flex items-center justify-center border transition-colors shrink-0"
      style={{ borderColor: INK, color: INK }}
      onMouseEnter={(e) => { e.currentTarget.style.background = INK; e.currentTarget.style.color = CARD; }}
      onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = INK; }}>
      {children}
    </button>
  );
}

/* --------------------------- tiny built-in charts --------------------------- */

function CategoryBarRows({ data }) {
  const max = Math.max(1, ...data.flatMap((d) => [d.budget, d.actual]));
  if (data.length === 0) return <div className="text-sm" style={{ color: INK_SOFT }}>Nothing to chart yet.</div>;
  return (
    <div>
      {data.map((d) => (
        <div key={d.name} className="mb-3">
          <div className="text-xs mb-1 font-mono" style={{ color: INK_SOFT }}>{d.name}</div>
          <div className="h-2.5 rounded-full overflow-hidden mb-1" style={{ background: '#F1ECDD' }}>
            <div className="h-full rounded-full" style={{ width: `${(d.budget / max) * 100}%`, background: PAPER_LINE }} />
          </div>
          <div className="h-2.5 rounded-full overflow-hidden" style={{ background: '#F1ECDD' }}>
            <div className="h-full rounded-full" style={{ width: `${(d.actual / max) * 100}%`, background: BRASS }} />
          </div>
        </div>
      ))}
      <div className="flex items-center gap-4 mt-3 text-xs font-mono" style={{ color: INK_SOFT }}>
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: PAPER_LINE }} />Budget</span>
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: BRASS }} />Actual</span>
      </div>
    </div>
  );
}

function TrendLineChart({ data, height = 190 }) {
  const width = 560;
  const max = Math.max(1, ...data.flatMap((d) => [d.budget, d.actual]));
  const padTop = 14, padBottom = 22, padX = 8;
  const innerH = height - padTop - padBottom;
  const stepX = data.length > 1 ? (width - padX * 2) / (data.length - 1) : 0;
  const scaleY = (v) => padTop + innerH - (v / max) * innerH;
  const pts = (key) => data.map((d, i) => `${padX + i * stepX},${scaleY(d[key])}`).join(' ');
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="xMidYMid meet">
      <polyline points={pts('budget')} fill="none" stroke={PAPER_LINE} strokeWidth="2" />
      <polyline points={pts('actual')} fill="none" stroke={BRASS} strokeWidth="2.5" />
      {data.map((d, i) => (
        <circle key={i} cx={padX + i * stepX} cy={scaleY(d.actual)} r="3.5" fill={BRASS} />
      ))}
      {data.map((d, i) => (
        <text key={i} x={padX + i * stepX} y={height - 4} fontSize="10.5" textAnchor="middle" fill={INK_SOFT} fontFamily="IBM Plex Mono, monospace">{d.name}</text>
      ))}
    </svg>
  );
}

/* ------------------------------ App --------------------------------- */

function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [activeTab, setActiveTab] = useState('Dashboard');
  const [selectedMonth, setSelectedMonth] = useState(currentMonthKey());
  const [selectedQuarter, setSelectedQuarter] = useState(quarterKeyFromMonth(currentMonthKey()));
  const loadedRef = useRef(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    let active = true;

    async function hydrate() {
      loadedRef.current = false;
      setLoading(true);
      const existing = await loadFromStorage();
      if (!active) return;
      setData(existing || defaultData());
      setLoading(false);
      loadedRef.current = true;
    }

    hydrate();

    function onAuthMessage(event) {
      if (!event.data || event.data.type !== 'firebase-auth-changed') return;
      if (!event.data.uid) {
        loadedRef.current = false;
        setData(defaultData());
        setLoading(false);
        return;
      }
      hydrate();
    }

    window.addEventListener('message', onAuthMessage);

    // If the parent had already signed in before this iframe was created,
    // the postMessage event may have happened before the listener existed.
    // Ask the parent for the current state and hydrate once more.
    (async () => {
      try {
        const C = window.parent && window.parent.Cloud;
        if (C && C.ready && typeof C.ready.then === 'function') await Promise.race([C.ready, new Promise(r => setTimeout(r, 8000))]);
      } catch (_) {}
      if (active) hydrate();
    })();
    return () => {
      active = false;
      window.removeEventListener('message', onAuthMessage);
    };
  }, []);

  useEffect(() => {
    if (!loadedRef.current || !data) return;
    saveToStorage(data);
  }, [data]);

  const update = (fn) => setData((prev) => {
    const next = JSON.parse(JSON.stringify(prev));
    fn(next);
    return next;
  });

  function exportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `moneyflow-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  function importData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed.categories || !parsed.transactions) throw new Error('bad file');
        setData(parsed);
      } catch (err) { alert('That file doesn\u2019t look like a Passbook export.'); }
    };
    reader.readAsText(file);
  }
  function resetData() {
    if (confirm('This clears all budgets, transactions, goals and reminders on this device. Continue?')) {
      setData(defaultData());
    }
  }

  /* ---------------------- derived / computed data --------------------- */

  const categories = data?.categories || [];
  const catById = useMemo(() => Object.fromEntries(categories.map((c) => [c.id, c])), [categories]);

  const txByMonth = useMemo(() => {
    const map = {};
    (data?.transactions || []).forEach((t) => {
      const key = t.date.slice(0, 7);
      if (!map[key]) map[key] = [];
      map[key].push(t);
    });
    return map;
  }, [data]);

  function monthStats(key) {
    const txs = txByMonth[key] || [];
    const income = txs.filter((t) => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
    const expenseTx = txs.filter((t) => t.type === 'expense');
    const totalExpense = expenseTx.reduce((s, t) => s + Number(t.amount), 0);
    const savingsActual = expenseTx.filter((t) => t.categoryId === 'savings').reduce((s, t) => s + Number(t.amount), 0);
    const byCat = {};
    expenseTx.forEach((t) => { byCat[t.categoryId] = (byCat[t.categoryId] || 0) + Number(t.amount); });
    const budgets = (data?.monthlyBudgets?.[key]?.budgets) || {};
    const totalBudget = Object.values(budgets).reduce((s, v) => s + Number(v || 0), 0);
    const remaining = income - totalExpense;
    const utilization = totalBudget > 0 ? (totalExpense / totalBudget) * 100 : 0;
    return { income, totalExpense, savingsActual, byCat, budgets, totalBudget, remaining, utilization, txs };
  }

  function quarterStats(qkey) {
    const months = monthsInQuarter(qkey);
    const perMonth = months.map((m) => monthStats(m));
    const income = perMonth.reduce((s, m) => s + m.income, 0);
    const totalExpense = perMonth.reduce((s, m) => s + m.totalExpense, 0);
    const totalBudget = perMonth.reduce((s, m) => s + m.totalBudget, 0);
    const remaining = totalBudget - totalExpense;
    const utilization = totalBudget > 0 ? (totalExpense / totalBudget) * 100 : 0;
    const byCat = {};
    perMonth.forEach((m) => Object.entries(m.byCat).forEach(([c, v]) => { byCat[c] = (byCat[c] || 0) + v; }));
    const byCatBudget = {};
    perMonth.forEach((m) => Object.entries(m.budgets).forEach(([c, v]) => { byCatBudget[c] = (byCatBudget[c] || 0) + Number(v || 0); }));
    return { months, income, totalExpense, totalBudget, remaining, utilization, byCat, byCatBudget };
  }

  const realMonthKey = currentMonthKey();
  const realQuarterKey = quarterKeyFromMonth(realMonthKey);
  const curStats = data ? monthStats(selectedMonth) : null;

  const insights = useMemo(() => {
    if (!data) return [];
    const out = [];
    const stats = monthStats(selectedMonth);
    categories.forEach((c) => {
      const budget = Number(stats.budgets[c.id] || 0);
      const actual = Number(stats.byCat[c.id] || 0);
      if (budget <= 0) return;
      const pct = (actual / budget) * 100;
      if (pct > 100) {
        out.push({ icon: '\u26A0\uFE0F', text: `${c.name} spending is ${Math.round(pct - 100)}% higher than your monthly budget.` });
      } else if (actual > 0 && pct < 80) {
        out.push({ icon: '\u2705', text: `${c.name} spending is ${Math.round(100 - pct)}% below budget.` });
      }
    });
    const prev3 = [1, 2, 3].map((n) => monthStats(shiftMonth(selectedMonth, -n)));
    const prevAvg = prev3.reduce((s, m) => s + m.totalExpense, 0) / 3;
    if (prevAvg > 0) {
      const change = ((stats.totalExpense - prevAvg) / prevAvg) * 100;
      if (Math.abs(change) >= 3) {
        out.push({
          icon: change > 0 ? '\uD83D\uDCC8' : '\uD83D\uDCC9',
          text: `Your average monthly spending ${change > 0 ? 'increased' : 'decreased'} by ${Math.round(Math.abs(change))}% compared with the last quarter.`,
        });
      }
    }
    (data.goals || []).forEach((g) => {
      const pct = g.target > 0 ? (Number(g.current) / Number(g.target)) * 100 : 0;
      out.push({ icon: '\uD83C\uDFAF', text: `You\u2019ve reached ${Math.round(pct)}% of your "${g.name}" savings goal.` });
    });
    return out.slice(0, 5);
  }, [data, selectedMonth]);

  const upcomingReminders = useMemo(() => {
    if (!data) return [];
    const today = new Date();
    return (data.reminders || []).map((r) => {
      const isMonthly = r.frequency === 'monthly';
      const period = isMonthly ? realMonthKey : realQuarterKey;
      const [y, m] = isMonthly
        ? realMonthKey.split('-').map(Number)
        : (() => { const months = monthsInQuarter(realQuarterKey); const [yy, mm] = months[2].split('-').map(Number); return [yy, mm]; })();
      const due = lastDayOfMonth(y, m);
      const daysLeft = daysBetween(due, today);
      const done = !!(r.completed || {})[period];
      return { ...r, period, due, daysLeft, done };
    }).filter((r) => !r.done).sort((a, b) => a.daysLeft - b.daysLeft);
  }, [data, realMonthKey, realQuarterKey]);

  if (loading || !data) {
    return (
      <div className="w-full min-h-screen flex items-center justify-center" style={{ background: PAPER, fontFamily: 'Inter, sans-serif' }}>
        <div style={{ color: INK }} className="text-sm tracking-widest uppercase">Opening the passbook\u2026</div>
      </div>
    );
  }

  return (
    <div className="w-full min-h-screen" style={{ background: "linear-gradient(180deg,#F7FAFF 0%,#F5F8FC 45%,#F3F7FB 100%)", fontFamily: "Inter, sans-serif", color: INK }}>
      <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
      .font-display { font-family:'Inter',sans-serif; }
      .font-mono { font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums; }
      .eyebrow { font-family:'Inter',sans-serif; font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:${INK_SOFT}; margin-bottom:6px; }
      .section-title { font-family:'Inter',sans-serif; font-weight:700; font-size:20px; color:${INK}; letter-spacing:-.025em; }
      .ledger-card { background:${CARD}; border:1px solid ${STITCH}; border-radius:18px; padding:22px; position:relative; box-shadow:0 8px 28px rgba(34,48,74,.055); }
      .ledger-card::before { display:none; }
      .ledger-page { background:${PAPER}; }
      .stamp { display:inline-flex; align-items:center; font-family:'Inter',sans-serif; font-size:10px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; padding:5px 10px; border:1px solid; border-radius:999px; background:#fff; }
      .tab-rail-btn { font-family:'Inter',sans-serif; font-size:13px; font-weight:500; text-align:left; padding:11px 13px; border-radius:11px; transition:all .16s ease; white-space:nowrap; }
      .tab-rail-btn:hover { background:#EEF3FF !important; color:${INK} !important; }
      input[type="date"]::-webkit-calendar-picker-indicator { opacity:.65; }
      .ledger-input { font-family:'Inter',sans-serif; background:#fff; border:1px solid ${STITCH}; border-radius:10px; padding:10px 12px; color:${INK}; outline:none; }
      .ledger-input:focus { border-color:${BRASS}; box-shadow:0 0 0 4px rgba(39,72,185,.10); }
      .ledger-select { font-family:'Inter',sans-serif; background:#fff; border:1px solid ${STITCH}; border-radius:10px; padding:10px 12px; color:${INK}; outline:none; }
      .ledger-select:focus { border-color:${BRASS}; box-shadow:0 0 0 4px rgba(39,72,185,.10); }
      .row-line { border-bottom:1px solid ${PAPER_LINE}; }
      ::selection { background:${BRASS}; color:#fff; }
      .scrollbar-thin::-webkit-scrollbar { height:6px; width:6px; }
      .scrollbar-thin::-webkit-scrollbar-thumb { background:#CBD3DE; border-radius:3px; }
      .util-btn { font-family:'Inter',sans-serif; font-size:11px; font-weight:600; padding:8px 11px; border-radius:9px; border:1px solid ${STITCH}; background:#fff; color:${INK_SOFT}; cursor:pointer; }
      .util-btn:hover { border-color:${BRASS}; color:${INK}; background:#F8FAFF; }
      body { background:#F5F8FC !important; }
    `}</style>

      <div className="flex flex-col md:flex-row max-w-[1380px] mx-auto">
        <div className="md:w-[230px] shrink-0 flex md:flex-col overflow-x-auto scrollbar-thin md:overflow-visible border-b md:border-b-0 md:border-r" style={{ borderColor: STITCH }}>
          <div className="hidden md:block px-4 pt-6 pb-4">
            <div className="eyebrow">Account No. {realMonthKey.replace('-', '\u2013')}</div>
            <div className="font-display" style={{ fontWeight: 700, fontSize: 19, lineHeight: 1.15 }}>MoneyFlow</div>
          </div>
          {TABS.map((t) => (
            <button key={t} onClick={() => setActiveTab(t)} className="tab-rail-btn"
              style={{
                background: activeTab === t ? '#EEF3FF' : 'transparent',
                color: activeTab === t ? INK : INK_SOFT,
                borderTop: activeTab === t ? `1px solid #D8E2FF` : '1px solid transparent',
                borderBottom: activeTab === t ? `1px solid #D8E2FF` : '1px solid transparent',
                borderLeft: activeTab === t ? `1px solid #D8E2FF` : '1px solid transparent',
                marginRight: activeTab === t ? '-1px' : 0,
                fontWeight: activeTab === t ? 600 : 400,
              }}>
              {t}
            </button>
          ))}
          <div className="hidden md:flex flex-col gap-1.5 px-4 py-5 mt-auto">
            <div className="eyebrow mb-1">Your data, on this device</div>
            <button className="util-btn text-left" onClick={exportData}>\u2913 Export data</button>
            <button className="util-btn text-left" onClick={() => fileInputRef.current?.click()}>\u2911 Import data</button>
            <input ref={fileInputRef} type="file" accept="application/json" className="hidden"
              onChange={(e) => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; }} />
            <button className="util-btn text-left" style={{ color: BAD }} onClick={resetData}>\u21BA Reset all data</button>
          </div>
        </div>

        <div className="flex-1 p-5 md:p-8 ledger-page">
          {activeTab === 'Dashboard' && (
            <DashboardTab selectedMonth={selectedMonth} setSelectedMonth={setSelectedMonth}
              stats={curStats} categories={categories} insights={insights} upcomingReminders={upcomingReminders} />
          )}
          {activeTab === 'Transactions' && (
            <TransactionsTab data={data} update={update} categories={categories}
              selectedMonth={selectedMonth} setSelectedMonth={setSelectedMonth} txByMonth={txByMonth} />
          )}
          {activeTab === 'Monthly Budget' && (
            <MonthlyBudgetTab data={data} update={update} categories={categories}
              selectedMonth={selectedMonth} setSelectedMonth={setSelectedMonth} stats={curStats} />
          )}
          {activeTab === 'Quarterly Review' && (
            <QuarterlyTab selectedQuarter={selectedQuarter} setSelectedQuarter={setSelectedQuarter}
              quarterStats={quarterStats} categories={categories} monthStats={monthStats} />
          )}
          {activeTab === 'Categories' && <CategoriesTab data={data} update={update} />}
          {activeTab === 'Goals' && <GoalsTab data={data} update={update} />}
          {activeTab === 'Reminders' && (
            <RemindersTab data={data} update={update} realMonthKey={realMonthKey} realQuarterKey={realQuarterKey} />
          )}
          <div className="md:hidden flex flex-wrap gap-2 mt-8 pt-5" style={{ borderTop: `1px dashed ${STITCH}` }}>
            <button className="util-btn" onClick={exportData}>\u2913 Export</button>
            <button className="util-btn" onClick={() => fileInputRef.current?.click()}>\u2911 Import</button>
            <button className="util-btn" style={{ color: BAD }} onClick={resetData}>\u21BA Reset</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* --------------------------- Transactions ----------------------------- */

function TransactionsTab({ data, update, categories, selectedMonth, setSelectedMonth, txByMonth }) {
  const [form, setForm] = useState({ date: todayISO(), type: 'expense', categoryId: categories[0]?.id || '', amount: '', note: '' });
  const monthTx = (txByMonth[selectedMonth] || []).slice().sort((a, b) => b.date.localeCompare(a.date));

  function addTx() {
    if (!form.amount || Number(form.amount) <= 0) return;
    update((d) => {
      d.transactions.push({
        id: 'tx-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        date: form.date, type: form.type, categoryId: form.type === 'income' ? null : form.categoryId, amount: Number(form.amount), note: form.note,
      });
    });
    setForm((f) => ({ ...f, amount: '', note: '' }));
  }
  function removeTx(id) { update((d) => { d.transactions = d.transactions.filter((t) => t.id !== id); }); }

  return (
    <div>
      <SectionTitle eyebrow="Ledger entries" title="Transactions" right={
        <div className="flex items-center gap-2">
          <IconBtn onClick={() => setSelectedMonth(shiftMonth(selectedMonth, -1))}>{'\u2039'}</IconBtn>
          <div className="font-mono text-sm w-28 text-center">{monthLabel(selectedMonth)}</div>
          <IconBtn onClick={() => setSelectedMonth(shiftMonth(selectedMonth, 1))}>{'\u203A'}</IconBtn>
        </div>
      } />

      <LedgerCard className="mb-5">
        <div className="grid grid-cols-2 md:grid-cols-6 gap-2.5 items-end">
          <div><div className="eyebrow">Date</div><input type="date" className="ledger-input w-full" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></div>
          <div>
            <div className="eyebrow">Type</div>
            <select className="ledger-select w-full" value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>
              <option value="expense">Expense</option><option value="income">Income</option>
            </select>
          </div>
          {form.type === 'expense' && (
            <div>
              <div className="eyebrow">Category</div>
              <select className="ledger-select w-full" value={form.categoryId} onChange={(e) => setForm({ ...form, categoryId: e.target.value })}>
                {categories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
          )}
          <div><div className="eyebrow">Amount (\u20B9)</div><input type="number" className="ledger-input w-full" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} placeholder="0" /></div>
          <div className="col-span-2"><div className="eyebrow">Note</div><input type="text" className="ledger-input w-full" value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="Optional" /></div>
          <button onClick={addTx} className="ledger-input w-full font-mono text-sm" style={{ background: INK, color: CARD, borderColor: INK, fontWeight: 600 }}>+ Add entry</button>
        </div>
      </LedgerCard>

      <LedgerCard>
        {monthTx.length === 0 && <div className="text-sm" style={{ color: INK_SOFT }}>No entries yet for {monthLabel(selectedMonth)}.</div>}
        <div className="overflow-x-auto scrollbar-thin">
          <table className="w-full text-sm">
            <thead><tr className="text-left" style={{ color: INK_SOFT }}>
              <th className="pb-2 eyebrow font-normal">Date</th><th className="pb-2 eyebrow font-normal">Category</th>
              <th className="pb-2 eyebrow font-normal">Note</th><th className="pb-2 eyebrow font-normal text-right">Amount</th><th className="pb-2"></th>
            </tr></thead>
            <tbody>
              {monthTx.map((t) => (
                <tr key={t.id} className="row-line">
                  <td className="py-2 font-mono text-xs" style={{ color: INK_SOFT }}>{t.date}</td>
                  <td className="py-2">{t.type === 'income' ? 'Income' : (categories.find((c) => c.id === t.categoryId)?.name || 'Other')}</td>
                  <td className="py-2" style={{ color: INK_SOFT }}>{t.note}</td>
                  <td className="py-2 text-right font-mono" style={{ color: t.type === 'income' ? GOOD : BAD }}>{t.type === 'income' ? '+' : '-'}{fmt(t.amount)}</td>

        </div>
      </LedgerCard>

/* -------------------------- Monthly Budget ----------------------------- */

function MonthlyBudgetTab({ data, update, categories, selectedMonth, setSelectedMonth, stats }) {
  function setBudget(catId, value) {
    update((d) => {
      if (!d.monthlyBudgets[selectedMonth]) d.monthlyBudgets[selectedMonth] = { budgets: {} };
      if (!d.monthlyBudgets[selectedMonth].budgets) d.monthlyBudgets[selectedMonth].budgets = {};
      d.monthlyBudgets[selectedMonth].budgets[catId] = Number(value) || 0;
    });
  }
  function copyFromPrevMonth() {
    const prev = shiftMonth(selectedMonth, -1);
    update((d) => {
      const prevBudgets = d.monthlyBudgets?.[prev]?.budgets || {};
      d.monthlyBudgets[selectedMonth] = { budgets: { ...prevBudgets } };
    });
  }

  return (
    <div>
      <SectionTitle eyebrow="Plan vs reality" title="Monthly Budget" right={
        <div className="flex items-center gap-2">
          <IconBtn onClick={() => setSelectedMonth(shiftMonth(selectedMonth, -1))}>{'\u2039'}</IconBtn>
          <div className="font-mono text-sm w-28 text-center">{monthLabel(selectedMonth)}</div>
          <IconBtn onClick={() => setSelectedMonth(shiftMonth(selectedMonth, 1))}>{'\u203A'}</IconBtn>
        </div>
      } />
      <div className="flex justify-end mb-3">
        <button onClick={copyFromPrevMonth} className="text-xs font-mono underline" style={{ color: INK_SOFT }}>Copy budgets from {monthShort(shiftMonth(selectedMonth, -1))}</button>
      </div>
      <LedgerCard>
        <div className="overflow-x-auto scrollbar-thin">
          <table className="w-full text-sm">
            <thead><tr className="text-left" style={{ color: INK_SOFT }}>
              <th className="pb-2 eyebrow font-normal">Category</th><th className="pb-2 eyebrow font-normal text-right">Budget</th>
              <th className="pb-2 eyebrow font-normal text-right">Actual</th><th className="pb-2 eyebrow font-normal text-right">Remaining</th>
              <th className="pb-2 eyebrow font-normal text-right">Status</th>
            </tr></thead>
            <tbody>
              {categories.map((c) => {
                const budget = Number(stats.budgets[c.id] || 0);
                const actual = Number(stats.byCat[c.id] || 0);
                const remaining = budget - actual;
                return (
                  <tr key={c.id} className="row-line">
                    <td className="py-2.5 flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: c.color }} />{c.name}</td>
                    <td className="py-2.5 text-right">
                      <input type="number" className="ledger-input text-right w-28" value={stats.budgets[c.id] || ''} onChange={(e) => setBudget(c.id, e.target.value)} placeholder="0" />
                    </td>
                    <td className="py-2.5 text-right font-mono">{fmt(actual)}</td>
                    <td className="py-2.5 text-right font-mono" style={{ color: remaining < 0 ? BAD : GOOD }}>{fmt(remaining)}</td>
                    <td className="py-2.5 text-right"><StampBadge status={statusOf(budget, actual)} /></td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr>
                <td className="pt-3 font-semibold">Total</td>
                <td className="pt-3 text-right font-mono font-semibold">{fmt(stats.totalBudget)}</td>
                <td className="pt-3 text-right font-mono font-semibold">{fmt(stats.totalExpense)}</td>
                <td className="pt-3 text-right font-mono font-semibold" style={{ color: stats.totalBudget - stats.totalExpense < 0 ? BAD : GOOD }}>{fmt(stats.totalBudget - stats.totalExpense)}</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </LedgerCard>
    </div>
  );
}

/* ------------------------------ Categories ------------------------------ */

function CategoriesTab({ data, update }) {
  const [name, setName] = useState('');
  const [color, setColor] = useState('#A9792C');

  function addCategory() {
    if (!name.trim()) return;
    update((d) => { d.categories.push({ id: 'cat-' + Date.now(), name: name.trim(), color }); });
    setName('');
  }
  function removeCategory(id) { update((d) => { d.categories = d.categories.filter((c) => c.id !== id); }); }

  return (
    <div>
      <SectionTitle eyebrow="Organize spending" title="Categories" />
      <LedgerCard className="mb-5">
        <div className="flex flex-wrap items-end gap-2.5">
          <div><div className="eyebrow">Name</div><input className="ledger-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Subscriptions" /></div>
          <div><div className="eyebrow">Color</div><input type="color" className="w-11 h-9 rounded border" style={{ borderColor: STITCH }} value={color} onChange={(e) => setColor(e.target.value)} /></div>
          <button onClick={addCategory} className="ledger-input font-mono text-sm" style={{ background: INK, color: CARD, borderColor: INK, fontWeight: 600 }}>+ Add category</button>
        </div>
      </LedgerCard>
      <div className="grid sm:grid-cols-2 md:grid-cols-3 gap-3">
        {data.categories.map((c) => (
          <LedgerCard key={c.id} className="flex items-center justify-between">
            <div className="flex items-center gap-2.5"><span className="w-4 h-4 rounded-full inline-block" style={{ background: c.color }} /><span className="font-medium">{c.name}</span></div>
            <button onClick={() => removeCategory(c.id)} className="text-xs" style={{ color: BAD }}>Remove</button>
          </LedgerCard>
        ))}
      </div>
    </div>
  );
}

/* --------------------------------- Goals --------------------------------- */

function GoalsTab({ data, update }) {
  const [form, setForm] = useState({ name: '', target: '', current: '', deadline: '' });

  function addGoal() {
    if (!form.name.trim() || !form.target) return;
    update((d) => { d.goals.push({ id: 'goal-' + Date.now(), name: form.name.trim(), target: Number(form.target), current: Number(form.current) || 0, deadline: form.deadline }); });
    setForm({ name: '', target: '', current: '', deadline: '' });
  }
  function removeGoal(id) { update((d) => { d.goals = d.goals.filter((g) => g.id !== id); }); }
  function bump(id, delta) { update((d) => { const g = d.goals.find((x) => x.id === id); if (g) g.current = Math.max(0, Number(g.current) + delta); }); }

  return (
    <div>
      <SectionTitle eyebrow="Save toward something" title="Goals" />
      <LedgerCard className="mb-5">
        <div className="grid grid-cols-2 md:grid-cols-5 gap-2.5 items-end">
          <div className="col-span-2"><div className="eyebrow">Goal name</div><input className="ledger-input w-full" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="e.g. Emergency fund" /></div>
          <div><div className="eyebrow">Target (\u20B9)</div><input type="number" className="ledger-input w-full" value={form.target} onChange={(e) => setForm({ ...form, target: e.target.value })} /></div>
          <div><div className="eyebrow">Saved so far (\u20B9)</div><input type="number" className="ledger-input w-full" value={form.current} onChange={(e) => setForm({ ...form, current: e.target.value })} /></div>
          <div><div className="eyebrow">Target date</div><input type="date" className="ledger-input w-full" value={form.deadline} onChange={(e) => setForm({ ...form, deadline: e.target.value })} /></div>
        </div>
        <button onClick={addGoal} className="ledger-input font-mono text-sm mt-3" style={{ background: INK, color: CARD, borderColor: INK, fontWeight: 600 }}>+ Add goal</button>
      </LedgerCard>
      <div className="grid md:grid-cols-2 gap-4">
        {data.goals.length === 0 && <div className="text-sm" style={{ color: INK_SOFT }}>No goals yet — add your first savings goal above.</div>}
        {data.goals.map((g) => {
          const pct = g.target > 0 ? (g.current / g.target) * 100 : 0;
          return (
            <LedgerCard key={g.id}>
              <div className="flex items-center justify-between mb-1">
                <div className="font-display" style={{ fontWeight: 600, fontSize: 17 }}>{g.name}</div>
                <button onClick={() => removeGoal(g.id)} className="text-xs" style={{ color: BAD }}>Remove</button>
              </div>
              {g.deadline && <div className="text-xs mb-2" style={{ color: INK_SOFT }}>by {g.deadline}</div>}
              <ProgressBar pct={pct} color={pct >= 100 ? GOOD : BRASS} />
              <div className="flex items-center justify-between mt-2">
                <div className="font-mono text-sm">{fmt(g.current)} <span style={{ color: INK_SOFT }}>of {fmt(g.target)}</span></div>
                <div className="flex items-center gap-1.5">
                  <button onClick={() => bump(g.id, -1000)} className="ledger-input px-2.5 py-1 text-xs">-1,000</button>
                  <button onClick={() => bump(g.id, 1000)} className="ledger-input px-2.5 py-1 text-xs">+1,000</button>
                </div>
              </div>
            </LedgerCard>
          );
        })}
      </div>
    </div>
  );
}

/* ------------------------------- Reminders -------------------------------- */

function RemindersTab({ data, update, realMonthKey, realQuarterKey }) {
  const [form, setForm] = useState({ label: '', frequency: 'monthly' });

  function addReminder() {
    if (!form.label.trim()) return;
    update((d) => { d.reminders.push({ id: 'rem-' + Date.now(), label: form.label.trim(), frequency: form.frequency, completed: {} }); });
    setForm({ label: '', frequency: 'monthly' });
  }
  function removeReminder(id) { update((d) => { d.reminders = d.reminders.filter((r) => r.id !== id); }); }
  function toggle(id) {
    update((d) => {
      const r = d.reminders.find((x) => x.id === id);
      if (!r) return;
      const period = r.frequency === 'monthly' ? realMonthKey : realQuarterKey;
      if (!r.completed) r.completed = {};
      r.completed[period] = !r.completed[period];
    });
  }

  const monthly = data.reminders.filter((r) => r.frequency === 'monthly');
  const quarterly = data.reminders.filter((r) => r.frequency === 'quarterly');

  const List = ({ items, period }) => (
    <ul>
      {items.map((r) => {
        const done = !!(r.completed || {})[period];
        return (
          <li key={r.id} className="row-line py-2.5 flex items-center justify-between">
            <label className="flex items-center gap-2.5 cursor-pointer text-sm">
              <input type="checkbox" checked={done} onChange={() => toggle(r.id)} className="w-4 h-4" />
              <span style={{ textDecoration: done ? 'line-through' : 'none', color: done ? INK_SOFT : INK }}>{r.label}</span>
            </label>
            <button onClick={() => removeReminder(r.id)} className="text-xs" style={{ color: BAD }}>Remove</button>
          </li>
        );
      })}
    </ul>
  );

  return (
    <div>
      <SectionTitle eyebrow="Never miss a review" title="Reminders" />
      <LedgerCard className="mb-5">
        <div className="flex flex-wrap items-end gap-2.5">
          <div className="flex-1 min-w-[180px]"><div className="eyebrow">Reminder</div><input className="ledger-input w-full" value={form.label} onChange={(e) => setForm({ ...form, label: e.target.value })} placeholder="e.g. Pay rent" /></div>
          <div>
            <div className="eyebrow">Frequency</div>
            <select className="ledger-select" value={form.frequency} onChange={(e) => setForm({ ...form, frequency: e.target.value })}>
              <option value="monthly">Monthly</option><option value="quarterly">Quarterly</option>
            </select>
          </div>
          <button onClick={addReminder} className="ledger-input font-mono text-sm" style={{ background: INK, color: CARD, borderColor: INK, fontWeight: 600 }}>+ Add reminder</button>
        </div>
      </LedgerCard>
      <div className="grid md:grid-cols-2 gap-4">
        <LedgerCard><SectionTitle eyebrow={monthLabel(realMonthKey)} title="Monthly" /><List items={monthly} period={realMonthKey} /></LedgerCard>
        <LedgerCard><SectionTitle eyebrow={quarterLabel(realQuarterKey)} title="Quarterly" /><List items={quarterly} period={realQuarterKey} /></LedgerCard>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
