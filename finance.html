<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MoneyFlow — Personal Budget Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #F6F7F3; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ------------------------------------------------------------------ */
/*  Design: "MoneyFlow" — a ledger / bank-passbook aesthetic.      */
/* ------------------------------------------------------------------ */

const INK = '#151112';
const INK_SOFT = '#6D7275';
const PAPER = '#F5F8FC';
const PAPER_LINE = '#E6EBF1';
const CARD = '#FFFFFF';
const BRASS = '#2748B9';
const GOOD = '#3C8B6A';
const BAD = '#BD3C2B';
const WARN = '#BD8B90';
const STITCH = '#E1E7EF';

const STORAGE_KEY = 'moneyflow-budget-v1';

const DEFAULT_CATEGORIES = [
  { id: 'housing', name: 'Housing', color: INK },
  { id: 'food', name: 'Food', color: BAD },
  { id: 'transport', name: 'Transport', color: GOOD },
  { id: 'utilities', name: 'Utilities', color: BRASS },
  { id: 'entertainment', name: 'Entertainment', color: '#6B4E9E' },
  { id: 'health', name: 'Health', color: '#2A6F8E' },
  { id: 'savings', name: 'Savings', color: '#3E7C5A' },
  { id: 'other', name: 'Other', color: '#7A7264' },
];

const DEFAULT_REMINDERS = [
  { id: 'r-review', label: 'Review this month\u2019s budget', frequency: 'monthly', completed: {} },
  { id: 'r-update', label: 'Enter / update expenses', frequency: 'monthly', completed: {} },
  { id: 'r-cc', label: 'Check credit-card payments', frequency: 'monthly', completed: {} },
  { id: 'r-qreview', label: 'Review quarterly spending', frequency: 'quarterly', completed: {} },
  { id: 'r-qsavings', label: 'Review savings performance', frequency: 'quarterly', completed: {} },
  { id: 'r-qadjust', label: 'Adjust next-quarter budget', frequency: 'quarterly', completed: {} },
];

/* ---------------------- default / normalized data ---------------------- */
/*
 * The Finance app previously called defaultData() but never defined it.
 * That caused the runtime error:
 *   ReferenceError: defaultData is not defined
 *
 * Keep this as a function (rather than a shared mutable object) so every
 * new session receives fresh arrays/objects.
 */
function defaultData() {
  return {
    categories: DEFAULT_CATEGORIES.map((c) => ({ ...c })),
    transactions: [],
    monthlyBudgets: {},
    goals: [],
    reminders: DEFAULT_REMINDERS.map((r) => ({ ...r, completed: { ...(r.completed || {}) } })),
  };
}

function normalizeFinanceData(raw) {
  const base = defaultData();
  if (!raw || typeof raw !== 'object') return base;

  return {
    categories: Array.isArray(raw.categories) ? raw.categories : base.categories,
    transactions: Array.isArray(raw.transactions) ? raw.transactions : base.transactions,
    monthlyBudgets: raw.monthlyBudgets && typeof raw.monthlyBudgets === 'object' ? raw.monthlyBudgets : {},
    goals: Array.isArray(raw.goals) ? raw.goals : [],
    reminders: Array.isArray(raw.reminders) ? raw.reminders : base.reminders,
  };
}

const TABS = ['Dashboard', 'Transactions', 'Monthly Budget', 'Quarterly Review', 'Categories', 'Goals', 'Reminders'];

/* ---------------------------- helpers ------------------------------ */

const fmt = (n) => '\u20B9' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const pad2 = (n) => String(n).padStart(2, '0');
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
};
const currentMonthKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
};
const monthLabel = (key) => {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('en-IN', { month: 'long', year: 'numeric' });
};
const monthShort = (key) => {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('en-IN', { month: 'short', year: '2-digit' });
};
const shiftMonth = (key, delta) => {
  let [y, m] = key.split('-').map(Number);
  m += delta;
  while (m < 1) { m += 12; y -= 1; }
  while (m > 12) { m -= 12; y += 1; }
  return `${y}-${pad2(m)}`;
};
const quarterKeyFromMonth = (key) => {
  const [y, m] = key.split('-').map(Number);
  return `${y}-Q${Math.ceil(m / 3)}`;
};
const monthsInQuarter = (qkey) => {
  const [y, q] = qkey.split('-Q').map(Number);
  const startM = (q - 1) * 3 + 1;
  return [0, 1, 2].map((i) => `${y}-${pad2(startM + i)}`);
};
const shiftQuarter = (qkey, delta) => {
  let [y, q] = qkey.split('-Q').map(Number);
  q += delta;
  while (q < 1) { q += 4; y -= 1; }
  while (q > 4) { q -= 4; y += 1; }
  return `${y}-Q${q}`;
};
const quarterLabel = (qkey) => {
  const [y, q] = qkey.split('-Q');
  return `Q${q} ${y}`;
};
const lastDayOfMonth = (y, m1) => new Date(y, m1, 0);
const daysBetween = (a, b) => Math.ceil((a - b) / 86400000);

function statusOf(budget, actual) {
  if (!budget || budget <= 0) return actual > 0 ? 'unbudgeted' : 'ontrack';
  const pct = (actual / budget) * 100;
  if (pct > 100) return 'over';
  if (pct >= 90) return 'near';
  return 'ontrack';
}
const statusMeta = {
  ontrack: { label: 'On Track', color: GOOD },
  near: { label: 'Near Limit', color: WARN },
  over: { label: 'Over Budget', color: BAD },
  unbudgeted: { label: 'Unbudgeted', color: INK_SOFT },
};

/* ------------------------- Firebase cloud I/O ------------------------- */

function legacyLoadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

/*
 * IMPORTANT: Finance runs inside an iframe while the Firebase Cloud bridge
 * lives in the parent window. Firestore's web SDK can reject objects created
 * in another JavaScript realm as a "custom Object". Build the final payload
 * in the parent realm before handing it to the Cloud bridge.
 */
function toParentRealmData(value) {
  try {
    const parentJSON = window.parent && window.parent.JSON;
    if (parentJSON && typeof parentJSON.parse === 'function') {
      return parentJSON.parse(JSON.stringify(value));
    }
  } catch (e) {
    console.warn('Finance cloud payload normalization failed:', e);
  }
  return JSON.parse(JSON.stringify(value));
}

async function loadFromStorage() {
  try {
    const parent = window.parent;
    const C = parent && parent.Cloud;

    // No Cloud bridge: use legacy local data, but do not pretend that it is
    // synchronized with another device.
    if (!C) {
      return { data: normalizeFinanceData(legacyLoadFromStorage()), canWriteCloud: false, source: 'local' };
    }

    // Wait for the parent application to finish restoring Firebase Auth.
    if (C.ready && typeof C.ready.then === 'function') {
      try {
        await Promise.race([
          C.ready,
          new Promise(r => setTimeout(r, 8000))
        ]);
      } catch (_) {}
    }

    const uid = typeof C.getCurrentUid === 'function' ? C.getCurrentUid() : null;
    if (!uid || typeof C.getItemSafe !== 'function') {
      return { data: normalizeFinanceData(legacyLoadFromStorage()), canWriteCloud: false, source: 'local' };
    }

    // Never leave the Finance tab on the loading screen indefinitely.
    const readPromise = C.getItemSafe('finance');
    const result = await Promise.race([
      readPromise,
      new Promise(resolve => setTimeout(
        () => resolve({ ok: false, exists: false, value: null, timeout: true }),
        8000
      ))
    ]);

    // IMPORTANT: a failed/timeout read must NOT be treated as "no data".
    // Otherwise a second device could overwrite real cloud data with defaults.
    if (!result || !result.ok) {
      console.warn('Finance Firebase read unavailable; using local/default data without cloud overwrite.');
      return {
        data: normalizeFinanceData(legacyLoadFromStorage()),
        canWriteCloud: false,
        source: 'unavailable'
      };
    }

    if (result.exists && result.value) {
      return {
        data: normalizeFinanceData(result.value),
        canWriteCloud: true,
        source: 'cloud'
      };
    }

    // One-time migration from previous browser-local Finance data.
    const legacy = legacyLoadFromStorage();
    if (legacy) {
      try {
        await C.setItem('finance', toParentRealmData(normalizeFinanceData(legacy)), { uid });
        return {
          data: normalizeFinanceData(legacy),
          canWriteCloud: true,
          source: 'migrated'
        };
      } catch (e) {
        console.warn('Finance legacy migration failed:', e);
        return {
          data: normalizeFinanceData(legacy),
          canWriteCloud: false,
          source: 'local'
        };
      }
    }

    // Authenticated user with no Finance document yet. It is safe to create it.
    return { data: defaultData(), canWriteCloud: true, source: 'new-cloud' };
  } catch (e) {
    console.warn('Finance Firebase load failed:', e);
    return {
      data: normalizeFinanceData(legacyLoadFromStorage()),
      canWriteCloud: false,
      source: 'error'
    };
  }
}

function saveToStorage(data) {
  try {
    const C = window.parent && window.parent.Cloud;
    const uid = C && typeof C.getCurrentUid === 'function' ? C.getCurrentUid() : null;
    if (!C || !uid) return;

    // Keep a device-local copy as a safety net.
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (_) {}

    // The parent window owns the Firebase SDK. Return an object created in
    // the parent JavaScript realm so Firestore accepts it as a plain object.
    const cloudData = toParentRealmData(data);
    C.scheduleSave('finance', () => cloudData, 500);
  } catch (e) {
    console.warn('Finance Firebase save failed:', e);
  }
}

/* --------------------------- small UI bits -------------------------- */

function StampBadge({ status }) {
  const meta = statusMeta[status] || statusMeta.ontrack;
  return <span className="stamp" style={{ color: meta.color, borderColor: meta.color }}>{meta.label}</span>;
}

function ProgressBar({ pct, color }) {
  const clamped = Math.max(0, Math.min(100, pct));
  return (
    <div className="w-full h-3 rounded-full overflow-hidden" style={{ background: PAPER_LINE }}>
      <div className="h-full rounded-full transition-all duration-700 ease-out"
        style={{ width: `${clamped}%`, background: color || (pct > 100 ? BAD : pct >= 90 ? WARN : GOOD) }} />
    </div>
  );
}

function LedgerCard({ children, className = '' }) {
  return <div className={`ledger-card ${className}`}>{children}</div>;
}

function SectionTitle({ eyebrow, title, right }) {
  return (
    <div className="flex items-end justify-between mb-4 flex-wrap gap-3">
      <div>
        {eyebrow && <div className="eyebrow">{eyebrow}</div>}
        <h2 className="section-title">{title}</h2>
      </div>
      {right}
    </div>
  );
}

function IconBtn({ onClick, children, title }) {
  return (
    <button onClick={onClick} title={title}
      className="w-8 h-8 rounded-full flex items-center justify-center border transition-colors shrink-0"
      style={{ borderColor: INK, color: INK }}
      onMouseEnter={(e) => { e.currentTarget.style.background = INK; e.currentTarget.style.color = CARD; }}
      onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = INK; }}>
      {children}
    </button>
  );
}

/* --------------------------- tiny built-in charts --------------------------- */

function CategoryBarRows({ data }) {
  const max = Math.max(1, ...data.flatMap((d) => [d.budget, d.actual]));
  if (data.length === 0) return <div className="text-sm" style={{ color: INK_SOFT }}>Nothing to chart yet.</div>;
  return (
    <div>
      {data.map((d) => (
        <div key={d.name} className="mb-3">
          <div className="text-xs mb-1 font-mono" style={{ color: INK_SOFT }}>{d.name}</div>
          <div className="h-2.5 rounded-full overflow-hidden mb-1" style={{ background: '#F1ECDD' }}>
            <div className="h-full rounded-full" style={{ width: `${(d.budget / max) * 100}%`, background: PAPER_LINE }} />
          </div>
          <div className="h-2.5 rounded-full overflow-hidden" style={{ background: '#F1ECDD' }}>
            <div className="h-full rounded-full" style={{ width: `${(d.actual / max) * 100}%`, background: BRASS }} />
          </div>
        </div>
      ))}
      <div className="flex items-center gap-4 mt-3 text-xs font-mono" style={{ color: INK_SOFT }}>
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: PAPER_LINE }} />Budget</span>
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: BRASS }} />Actual</span>
      </div>
    </div>
  );
}

function TrendLineChart({ data, height = 190 }) {
  const width = 560;
  const max = Math.max(1, ...data.flatMap((d) => [d.budget, d.actual]));
  const padTop = 14, padBottom = 22, padX = 8;
  const innerH = height - padTop - padBottom;
  const stepX = data.length > 1 ? (width - padX * 2) / (data.length - 1) : 0;
  const scaleY = (v) => padTop + innerH - (v / max) * innerH;
  const pts = (key) => data.map((d, i) => `${padX + i * stepX},${scaleY(d[key])}`).join(' ');
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="xMidYMid meet">
      <polyline points={pts('budget')} fill="none" stroke={PAPER_LINE} strokeWidth="2" />
      <polyline points={pts('actual')} fill="none" stroke={BRASS} strokeWidth="2.5" />
      {data.map((d, i) => (
        <circle key={i} cx={padX + i * stepX} cy={scaleY(d.actual)} r="3.5" fill={BRASS} />
      ))}
      {data.map((d, i) => (
        <text key={i} x={padX + i * stepX} y={height - 4} fontSize="10.5" textAnchor="middle" fill={INK_SOFT} fontFamily="IBM Plex Mono, monospace">{d.name}</text>
      ))}
    </svg>
  );
}

/* ------------------------------ App --------------------------------- */

function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [activeTab, setActiveTab] = useState('Dashboard');
  const [selectedMonth, setSelectedMonth] = useState(currentMonthKey());
  const [selectedQuarter, setSelectedQuarter] = useState(quarterKeyFromMonth(currentMonthKey()));
  const loadedRef = useRef(false);
  const [cloudWriteEnabled, setCloudWriteEnabled] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    let active = true;

    async function hydrate() {
      loadedRef.current = false;
      setLoading(true);
      const result = await loadFromStorage();
      if (!active) return;
      const hydratedData = normalizeFinanceData(result?.data);
      setData(hydratedData);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(hydratedData));
      } catch (_) {}
      setCloudWriteEnabled(!!result?.canWriteCloud);
      setLoading(false);
      loadedRef.current = true;
    }

    hydrate();

    function onAuthMessage(event) {
      if (!event.data || event.data.type !== 'firebase-auth-changed') return;
      if (!event.data.uid) {
        loadedRef.current = false;
        setCloudWriteEnabled(false);
        setData(defaultData());
        setLoading(false);
        return;
      }
      hydrate();
    }

    window.addEventListener('message', onAuthMessage);

    // If the parent had already signed in before this iframe was created,
    // the postMessage event may have happened before the listener existed.
    // Ask the parent for the current state and hydrate once more.
    (async () => {
      try {
        const C = window.parent && window.parent.Cloud;
        if (C && C.ready && typeof C.ready.then === 'function') await Promise.race([C.ready, new Promise(r => setTimeout(r, 8000))]);
      } catch (_) {}
      if (active) hydrate();
    })();
    return () => {
      active = false;
      window.removeEventListener('message', onAuthMessage);
    };
  }, []);

  useEffect(() => {
    if (!loadedRef.current || !data || !cloudWriteEnabled) return;
    saveToStorage(data);
  }, [data, cloudWriteEnabled]);

  const update = (fn) => setData((prev) => {
    const next = JSON.parse(JSON.stringify(prev));
    fn(next);
    return next;
  });

  function exportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `moneyflow-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportExcel() {
    if (!window.XLSX || !data) {
      alert('Excel export is not available right now. Please check your internet connection and try again.');
      return;
    }

    const wb = XLSX.utils.book_new();

    // Summary
    const summaryRows = [
      ['MoneyFlow Export', ''],
      ['Export Date', todayISO()],
      ['Current Month', currentMonthKey()],
      ['Current Quarter', quarterKeyFromMonth(currentMonthKey())],
      [],
      ['Metric', 'Value'],
      ['Income', monthStats(currentMonthKey()).income],
      ['Expenses', monthStats(currentMonthKey()).totalExpense],
      ['Remaining', monthStats(currentMonthKey()).remaining],
      ['Savings', monthStats(currentMonthKey()).savingsActual],
      ['Budget', monthStats(currentMonthKey()).totalBudget],
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Summary');

    // Transactions
    const txRows = (data.transactions || []).map(t => ({
      Date: t.date,
      Type: t.type,
      Category: t.type === 'income' ? 'Income' : ((data.categories || []).find(c => c.id === t.categoryId)?.name || 'Other'),
      Amount: Number(t.amount) || 0,
      Note: t.note || ''
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(txRows.length ? txRows : [{Date:'',Type:'',Category:'',Amount:'',Note:''}]), 'Transactions');

    // Categories
    const catRows = (data.categories || []).map(c => ({
      ID: c.id, Category: c.name, Color: c.color
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(catRows.length ? catRows : [{ID:'',Category:'',Color:''}]), 'Categories');

    // Monthly Budgets
    const budgetRows = [];
    Object.entries(data.monthlyBudgets || {}).forEach(([month, obj]) => {
      Object.entries(obj?.budgets || {}).forEach(([catId, amount]) => {
        const cat = (data.categories || []).find(c => c.id === catId);
        budgetRows.push({
          Month: month,
          Category: cat?.name || catId,
          Budget: Number(amount) || 0
        });
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
      budgetRows.length ? budgetRows : [{Month:'',Category:'',Budget:''}]
    ), 'Monthly Budgets');

    // Goals
    const goalRows = (data.goals || []).map(g => ({
      Goal: g.name || '',
      Target: Number(g.target) || 0,
      Saved: Number(g.current) || 0,
      Progress: g.target ? `${Math.round((Number(g.current || 0) / Number(g.target)) * 100)}%` : '0%',
      Deadline: g.deadline || ''
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
      goalRows.length ? goalRows : [{Goal:'',Target:'',Saved:'',Progress:'',Deadline:''}]
    ), 'Goals');

    // Reminders
    const reminderRows = (data.reminders || []).map(r => ({
      Reminder: r.label || '',
      Frequency: r.frequency || '',
      CompletedPeriods: Object.keys(r.completed || {}).filter(k => r.completed[k]).join(', ')
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
      reminderRows.length ? reminderRows : [{Reminder:'',Frequency:'',CompletedPeriods:''}]
    ), 'Reminders');

    // Make columns readable.
    wb.Sheets['Summary']['!cols'] = [{ wch: 24 }, { wch: 20 }];
    wb.Sheets['Transactions']['!cols'] = [
      { wch: 14 }, { wch: 12 }, { wch: 20 }, { wch: 14 }, { wch: 40 }
    ];
    wb.Sheets['Categories']['!cols'] = [{ wch: 22 }, { wch: 24 }, { wch: 14 }];
    wb.Sheets['Monthly Budgets']['!cols'] = [{ wch: 14 }, { wch: 24 }, { wch: 14 }];
    wb.Sheets['Goals']['!cols'] = [{ wch: 28 }, { wch: 14 }, { wch: 14 }, { wch: 12 }, { wch: 14 }];
    wb.Sheets['Reminders']['!cols'] = [{ wch: 40 }, { wch: 14 }, { wch: 40 }];

    XLSX.writeFile(wb, `moneyflow-${todayISO()}.xlsx`);
  }
  function importData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed.categories || !parsed.transactions) throw new Error('bad file');
        setData(parsed);
      } catch (err) { alert('That file doesn\u2019t look like a Passbook export.'); }
    };
    reader.readAsText(file);
  }
  function resetData() {
    if (confirm('This clears all budgets, transactions, goals and reminders on this device. Continue?')) {
      setData(defaultData());
    }
  }

  /* ---------------------- derived / computed data --------------------- */

  const categories = data?.categories || [];
  const catById = useMemo(() => Object.fromEntries(categories.map((c) => [c.id, c])), [categories]);

  const txByMonth = useMemo(() => {
    const map = {};
    (data?.transactions || []).forEach((t) => {
      const key = t.date.slice(0, 7);
      if (!map[key]) map[key] = [];
      map[key].push(t);
    });
    return map;
  }, [data]);

  function monthStats(key) {
    const txs = txByMonth[key] || [];
    const income = txs.filter((t) => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
    const expenseTx = txs.filter((t) => t.type === 'expense');
    const totalExpense = expenseTx.reduce((s, t) => s + Number(t.amount), 0);
    const savingsActual = expenseTx.filter((t) => t.categoryId === 'savings').reduce((s, t) => s + Number(t.amount), 0);
    const byCat = {};
    expenseTx.forEach((t) => { byCat[t.categoryId] = (byCat[t.categoryId] || 0) + Number(t.amount); });
    const budgets = (data?.monthlyBudgets?.[key]?.budgets) || {};
    const totalBudget = Object.values(budgets).reduce((s, v) => s + Number(v || 0), 0);
    const remaining = income - totalExpense;
    const utilization = totalBudget > 0 ? (totalExpense / totalBudget) * 100 : 0;
    return { income, totalExpense, savingsActual, byCat, budgets, totalBudget, remaining, utilization, txs };
  }

  function quarterStats(qkey) {
    const months = monthsInQuarter(qkey);
    const perMonth = months.map((m) => monthStats(m));
    const income = perMonth.reduce((s, m) => s + m.income, 0);
    const totalExpense = perMonth.reduce((s, m) => s + m.totalExpense, 0);
    const totalBudget = perMonth.reduce((s, m) => s + m.totalBudget, 0);
    const remaining = totalBudget - totalExpense;
    const utilization = totalBudget > 0 ? (totalExpense / totalBudget) * 100 : 0;
    const byCat = {};
    perMonth.forEach((m) => Object.entries(m.byCat).forEach(([c, v]) => { byCat[c] = (byCat[c] || 0) + v; }));
    const byCatBudget = {};
    perMonth.forEach((m) => Object.entries(m.budgets).forEach(([c, v]) => { byCatBudget[c] = (byCatBudget[c] || 0) + Number(v || 0); }));
    return { months, income, totalExpense, totalBudget, remaining, utilization, byCat, byCatBudget };
  }

  const realMonthKey = currentMonthKey();
  const realQuarterKey = quarterKeyFromMonth(realMonthKey);
  const curStats = data ? monthStats(selectedMonth) : null;

  const insights = useMemo(() => {
    if (!data) return [];
    const out = [];
    const stats = monthStats(selectedMonth);
    categories.forEach((c) => {
      const budget = Number(stats.budgets[c.id] || 0);
      const actual = Number(stats.byCat[c.id] || 0);
      if (budget <= 0) return;
      const pct = (actual / budget) * 100;
      if (pct > 100) {
        out.push({ icon: '\u26A0\uFE0F', text: `${c.name} spending is ${Math.round(pct - 100)}% higher than your monthly budget.` });
      } else if (actual > 0 && pct < 80) {
        out.push({ icon: '\u2705', text: `${c.name} spending is ${Math.round(100 - pct)}% below budget.` });
      }
    });
    const prev3 = [1, 2, 3].map((n) => monthStats(shiftMonth(selectedMonth, -n)));
    const prevAvg = prev3.reduce((s, m) => s + m.totalExpense, 0) / 3;
    if (prevAvg > 0) {
      const change = ((stats.totalExpense - prevAvg) / prevAvg) * 100;
      if (Math.abs(change) >= 3) {
        out.push({
          icon: change > 0 ? '\uD83D\uDCC8' : '\uD83D\uDCC9',
          text: `Your average monthly spending ${change > 0 ? 'increased' : 'decreased'} by ${Math.round(Math.abs(change))}% compared with the last quarter.`,
        });
      }
    }
    (data.goals || []).forEach((g) => {
      const pct = g.target > 0 ? (Number(g.current) / Number(g.target)) * 100 : 0;
      out.push({ icon: '\uD83C\uDFAF', text: `You\u2019ve reached ${Math.round(pct)}% of your "${g.name}" savings goal.` });
    });
    return out.slice(0, 5);
  }, [data, selectedMonth]);

  const upcomingReminders = useMemo(() => {
    if (!data) return [];
    const today = new Date();
    return (data.reminders || []).map((r) => {
      const isMonthly = r.frequency === 'monthly';
      const period = isMonthly ? realMonthKey : realQuarterKey;
      const [y, m] = isMonthly
        ? realMonthKey.split('-').map(Number)
        : (() => { const months = monthsInQuarter(realQuarterKey); const [yy, mm] = months[2].split('-').map(Number); return [yy, mm]; })();
      const due = lastDayOfMonth(y, m);
      const daysLeft = daysBetween(due, today);
      const done = !!(r.completed || {})[period];
      return { ...r, period, due, daysLeft, done };
    }).filter((r) => !r.done).sort((a, b) => a.daysLeft - b.daysLeft);
  }, [data, realMonthKey, realQuarterKey]);

  if (loading || !data) {
    return (
      <div className="w-full min-h-screen flex items-center justify-center" style={{ background: PAPER, fontFamily: 'Inter, sans-serif' }}>
        <div style={{ color: INK }} className="text-sm tracking-widest uppercase">Opening the passbook\u2026</div>
      </div>
    );
  }

  return (
    <div className="w-full min-h-screen" style={{ background: "linear-gradient(180deg,#F7FAFF 0%,#F5F8FC 45%,#F3F7FB 100%)", fontFamily: "Inter, sans-serif", color: INK }}>

      .font-display { font-family:'Inter',sans-serif; }

      .eyebrow { font-family:'Inter',sans-serif; font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:${INK_SOFT}; margin-bottom:6px; }
      .section-title { font-family:'Inter',sans-serif; font-weight:700; font-size:20px; color:${INK}; letter-spacing:-.025em; }
      .ledger-card { background:${CARD}; border:1px solid ${STITCH}; border-radius:18px; padding:22px; position:relative; box-shadow:0 8px 28px rgba(34,48,74,.055); }
      .ledger-card::before { display:none; }
      .ledger-page { background:${PAPER}; }
      .stamp { display:inline-flex; align-items:center; font-family:'Inter',sans-serif; font-size:10px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; padding:5px 10px; border:1px solid; border-radius:999px; background:#fff; }
      .tab-rail-btn { font-family:'Inter',sans-serif; font-size:13px; font-weight:500; text-align:left; padding:11px 13px; border-radius:11px; transition:all .16s ease; white-space:nowrap; }
      .tab-rail-btn:hover { background:#EEF3FF !important; color:${INK} !important; }
      input[type="date"]::-webkit-calendar-picker-indicator { opacity:.65; }
      .ledger-input { font-family:'Inter',sans-serif; background:#fff; border:1px solid ${STITCH}; border-radius:10px; padding:10px 12px; color:${INK}; outline:none; }
      .ledger-input:focus { border-color:${BRASS}; box-shadow:0 0 0 4px rgba(39,72,185,.10); }
      .ledger-select { font-family:'Inter',sans-serif; background:#fff; border:1px solid ${STITCH}; border-radius:10px; padding:10px 12px; color:${INK}; outline:none; }
      .ledger-select:focus { border-color:${BRASS}; box-shadow:0 0 0 4px rgba(39,72,185,.10); }
      .row-line { border-bottom:1px solid ${PAPER_LINE}; }
      ::selection { background:${BRASS}; color:#fff; }
      .scrollbar-thin::-webkit-scrollbar { height:6px; width:6px; }

    `}</style>

      <div className="flex flex-col md:flex-row max-w-[1380px] mx-auto">
        <div className="md:w-[230px] shrink-0 flex md:flex-col overflow-x-auto scrollbar-thin md:overflow-visible border-b md:border-b-0 md:border-r" style={{ borderColor: STITCH }}>
          <div className="hidden md:block px-4 pt-6 pb-4">
            <div className="eyebrow">Account No. {realMonthKey.replace('-', '\u2013')}</div>
            <div className="font-display" style={{ fontWeight: 700, fontSize: 19, lineHeight: 1.15 }}>MoneyFlow</div>
          </div>
          {TABS.map((t) => (
            <button key={t} onClick={() => setActiveTab(t)} className="tab-rail-btn"
              style={{
                background: activeTab === t ? '#EEF3FF' : 'transparent',
                color: activeTab === t ? INK : INK_SOFT,
                borderTop: activeTab === t ? `1px solid #D8E2FF` : '1px solid transparent',
                borderBottom: activeTab === t ? `1px solid #D8E2FF` : '1px solid transparent',
                borderLeft: activeTab === t ? `1px solid #D8E2FF` : '1px solid transparent',

            <TransactionsTab data={data} update={update} categories={categories}
              selectedMonth={selectedMonth} setSelectedMonth={setSelectedMonth} txByMonth={txByMonth} />
          )}
          {activeTab === 'Monthly Budget' && (
            <MonthlyBudgetTab data={data} update={update} categories={categories}

          {activeTab === 'Quarterly Review' && (

          )}
          {activeTab === 'Categories' && <CategoriesTab data={data} update={update} />}
          {activeTab === 'Goals' && <GoalsTab data={data} update={update} />}

/* --------------------------- Transactions ----------------------------- */

function TransactionsTab({ data, update, categories, selectedMonth, setSelectedMonth, txByMonth }) {
  const [form, setForm] = useState({ date: todayISO(), type: 'expense', categoryId: categories[0]?.id || '', amount: '', note: '' });
  const monthTx = (txByMonth[selectedMonth] || []).slice().sort((a, b) => b.date.localeCompare(a.date));

  function addTx() {
    if (!form.amount || Number(form.amount) <= 0) return;
    update((d) => {
      d.transactions.push({
        id: 'tx-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        date: form.date, type: form.type, categoryId: form.type === 'income' ? null : form.categoryId, amount: Number(form.amount), note: form.note,
      });
    });
    setForm((f) => ({ ...f, amount: '', note: '' }));
  }
  function removeTx(id) { update((d) => { d.transactions = d.transactions.filter((t) => t.id !== id); }); }

  return (
    <div>
      <SectionTitle eyebrow="Ledger entries" title="Transactions" right={
        <div className="flex items-center gap-2">
          <IconBtn onClick={() => setSelectedMonth(shiftMonth(selectedMonth, -1))}>{'\u2039'}</IconBtn>
          <div className="font-mono text-sm w-28 text-center">{monthLabel(selectedMonth)}</div>
          <IconBtn onClick={() => setSelectedMonth(shiftMonth(selectedMonth, 1))}>{'\u203A'}</IconBtn>
        </div>
      } />

      <LedgerCard className="mb-5">
        <div className="grid grid-cols-2 md:grid-cols-6 gap-2.5 items-end">
          <div><div className="eyebrow">Date</div><input type="date" className="ledger-input w-full" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></div>
          <div>
            <div className="eyebrow">Type</div>
            <select className="ledger-select w-full" value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>
              <option value="expense">Expense</option><option value="income">Income</option>
            </select>
          </div>
          {form.type === 'expense' && (
            <div>
              <div className="eyebrow">Category</div>
              <select className="ledger-select w-full" value={form.categoryId} onChange={(e) => setForm({ ...form, categoryId: e.target.value })}>
                {categories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
          )}
          <div><div className="eyebrow">Amount (\u20B9)</div><input type="number" className="ledger-input w-full" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} placeholder="0" /></div>
          <div className="col-span-2"><div className="eyebrow">Note</div><input type="text" className="ledger-input w-full" value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="Optional" /></div>
          <button onClick={addTx} className="ledger-input w-full font-mono text-sm" style={{ background: INK, color: CARD, borderColor: INK, fontWeight: 600 }}>+ Add entry</button>
        </div>
      </LedgerCard>

      <LedgerCard>
        {monthTx.length === 0 && <div className="text-sm" style={{ color: INK_SOFT }}>No entries yet for {monthLabel(selectedMonth)}.</div>}
        <div className="overflow-x-auto scrollbar-thin">
          <table className="w-full text-sm">
            <thead><tr className="text-left" style={{ color: INK_SOFT }}>
              <th className="pb-2 eyebrow font-normal">Date</th><th className="pb-2 eyebrow font-normal">Category</th>
              <th className="pb-2 eyebrow font-normal">Note</th><th className="pb-2 eyebrow font-normal text-right">Amount</th><th className="pb-2"></th>
            </tr></thead>
            <tbody>
              {monthTx.map((t) => (
                <tr key={t.id} className="row-line">
                  <td className="py-2 font-mono text-xs" style={{ color: INK_SOFT }}>{t.date}</td>
                  <td className="py-2">{t.type === 'income' ? 'Income' : (categories.find((c) => c.id === t.categoryId)?.name || 'Other')}</td>
                  <td className="py-2" style={{ color: INK_SOFT }}>{t.note}</td>
                  <td className="py-2 text-right font-mono" style={{ color: t.type === 'income' ? GOOD : BAD }}>{t.type === 'income' ? '+' : '-'}{fmt(t.amount)}</td>

        </div>
      </LedgerCard>
    </div>
  );
}

/* -------------------------- Monthly Budget ----------------------------- */

function MonthlyBudgetTab({ data, update, categories, selectedMonth, setSelectedMonth, stats }) {
  function setBudget(catId, value) {
    update((d) => {
      if (!d.monthlyBudgets[selectedMonth]) d.monthlyBudgets[selectedMonth] = { budgets: {} };
      if (!d.monthlyBudgets[selectedMonth].budgets) d.monthlyBudgets[selectedMonth].budgets = {};
      d.monthlyBudgets[selectedMonth].budgets[catId] = Number(value) || 0;
    });
  }
  function copyFromPrevMonth() {
    const prev = shiftMonth(selectedMonth, -1);
    update((d) => {
      const prevBudgets = d.monthlyBudgets?.[prev]?.budgets || {};
      d.monthlyBudgets[selectedMonth] = { budgets: { ...prevBudgets } };
    });
  }

  return (
    <div>
      <SectionTitle eyebrow="Plan vs reality" title="Monthly Budget" right={
        <div className="flex items-center gap-2">
          <IconBtn onClick={() => setSelectedMonth(shiftMonth(selectedMonth, -1))}>{'\u2039'}</IconBtn>
          <div className="font-mono text-sm w-28 text-center">{monthLabel(selectedMonth)}</div>
          <IconBtn onClick={() => setSelectedMonth(shiftMonth(selectedMonth, 1))}>{'\u203A'}</IconBtn>
        </div>
      } />
      <div className="flex justify-end mb-3">
        <button onClick={copyFromPrevMonth} className="text-xs font-mono underline" style={{ color: INK_SOFT }}>Copy budgets from {monthShort(shiftMonth(selectedMonth, -1))}</button>
      </div>
      <LedgerCard>
        <div className="overflow-x-auto scrollbar-thin">
          <table className="w-full text-sm">
            <thead><tr className="text-left" style={{ color: INK_SOFT }}>
              <th className="pb-2 eyebrow font-normal">Category</th><th className="pb-2 eyebrow font-normal text-right">Budget</th>
              <th className="pb-2 eyebrow font-normal text-right">Actual</th><th className="pb-2 eyebrow font-normal text-right">Remaining</th>
              <th className="pb-2 eyebrow font-normal text-right">Status</th>
            </tr></thead>
            <tbody>
              {categories.map((c) => {
                const budget = Number(stats.budgets[c.id] || 0);
                const actual = Number(stats.byCat[c.id] || 0);
                const remaining = budget - actual;
                return (
                  <tr key={c.id} className="row-line">
                    <td className="py-2.5 flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: c.color }} />{c.name}</td>
                    <td className="py-2.5 text-right">
                      <input type="number" className="ledger-input text-right w-28" value={stats.budgets[c.id] || ''} onChange={(e) => setBudget(c.id, e.target.value)} placeholder="0" />
                    </td>
                    <td className="py-2.5 text-right font-mono">{fmt(actual)}</td>
                    <td className="py-2.5 text-right font-mono" style={{ color: remaining < 0 ? BAD : GOOD }}>{fmt(remaining)}</td>
                    <td className="py-2.5 text-right"><StampBadge status={statusOf(budget, actual)} /></td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr>
                <td className="pt-3 font-semibold">Total</td>
                <td className="pt-3 text-right font-mono font-semibold">{fmt(stats.totalBudget)}</td>
                <td className="pt-3 text-right font-mono font-semibold">{fmt(stats.totalExpense)}</td>
                <td className="pt-3 text-right font-mono font-semibold" style={{ color: stats.totalBudget - stats.totalExpense < 0 ? BAD : GOOD }}>{fmt(stats.totalBudget - stats.totalExpense)}</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </LedgerCard>
    </div>
  );
}

function QuarterlyTab({ selectedQuarter, setSelectedQuarter, quarterStats, categories, monthStats }) {
  const q = quarterStats(selectedQuarter);
  const trend = [3, 2, 1, 0].map((n) => {
    const qkey = shiftQuarter(selectedQuarter, -n);
    const qs = quarterStats(qkey);
    return { name: quarterLabel(qkey), actual: qs.totalExpense, budget: qs.totalBudget };

/* ------------------------------- Reminders -------------------------------- */
/* User-configurable reminder system. Native mobile delivery is exposed through
   window.PersonalTrackerNotifications when the Android/iOS wrapper provides it. */

const REMINDER_RECURRENCES = [
  ['none','One time'],['daily','Daily'],['weekly','Weekly'],
  ['monthly','Monthly'],['yearly','Yearly'],['custom','Custom interval']
];
const REMINDER_TRIGGERS = [
  ['time','Time-based'],['event','Event-based'],
  ['location','Location-based'],['custom','Custom condition']
];

function reminderDefaultForm() {
  const now = new Date();
  return {
    id:null,title:'',description:'',date:todayISO(),
    time:`${pad2(now.getHours())}:${pad2(now.getMinutes())}`,
    recurrence:'none',interval:1,intervalUnit:'days',
    triggerType:'time',triggerValue:'',
    timezone:Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC',
    enabled:true,snoozeMinutes:60,lastTriggeredAt:null,notificationId:null
  };
}
function normalizeReminder(r) {
  const base=reminderDefaultForm();
  return {...base,...r,
    id:r?.id || `rem-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
    interval:Math.max(1,Number(r?.interval||1)),
    enabled:r?.enabled!==false,timezone:r?.timezone||base.timezone
  };
}
function nextReminderOccurrence(reminder,from=new Date()) {
  const r=normalizeReminder(reminder);
  const d0=new Date(`${r.date}T${r.time||'09:00'}:00`);
  if(Number.isNaN(d0.getTime())) return null;
  if(r.recurrence==='none') return d0>from?d0:null;
  let d=new Date(d0);
  for(let i=0;i<2000 && d<=from;i++){
    if(r.recurrence==='daily') d.setDate(d.getDate()+1);
    else if(r.recurrence==='weekly') d.setDate(d.getDate()+7);
    else if(r.recurrence==='monthly') d.setMonth(d.getMonth()+1);
    else if(r.recurrence==='yearly') d.setFullYear(d.getFullYear()+1);
    else if(r.recurrence==='custom'){
      if(r.intervalUnit==='weeks') d.setDate(d.getDate()+7*r.interval);
      else if(r.intervalUnit==='months') d.setMonth(d.getMonth()+r.interval);
      else if(r.intervalUnit==='years') d.setFullYear(d.getFullYear()+r.interval);
      else d.setDate(d.getDate()+r.interval);
    } else return null;
  }
  return d>from?d:null;
}
function formatReminderDateTime(r) {
  const d=nextReminderOccurrence(r,new Date(Date.now()-1000));
  return d?d.toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'No future occurrence';
}
function notificationBridge(){return window.PersonalTrackerNotifications||null;}

function notificationPermissionState(){
  try{
    const b=notificationBridge();
    if(b?.permissionState) return b.permissionState();
    if('Notification' in window) return Notification.permission;
  }catch(_){}
  return 'unsupported';
}

async function requestReminderNotificationPermission(){
  try{
    const b=notificationBridge();
    if(b?.requestPermission){
      const result=await b.requestPermission();
      return result===true || result==='granted' || result?.granted===true;
    }
    if('Notification' in window){
      return (await Notification.requestPermission())==='granted';
    }
  }catch(e){console.warn('Notification permission request failed:',e);}
  return false;
}

function clearWebReminderTimer(id){
  if(window.__reminderTimers?.[id]){clearTimeout(window.__reminderTimers[id]);delete window.__reminderTimers[id];}
}

function armWebReminderTimer(reminder){
  const r=normalizeReminder(reminder);
  clearWebReminderTimer(r.id);
  const next=nextReminderOccurrence(r);
  if(!r.enabled||!next||typeof Notification==='undefined'||Notification.permission!=='granted') return false;

  // setTimeout is limited to ~24.8 days. Re-arm in chunks so long-term
  // reminders still work while the web app remains open.
  const MAX=2147483647;
  const delay=Math.max(1000,next.getTime()-Date.now());
  const wait=Math.min(delay,MAX);
  window.__reminderTimers=window.__reminderTimers||{};
  window.__reminderTimers[r.id]=setTimeout(()=>{
    try{
      const due=nextReminderOccurrence(r,new Date(Date.now()-1000));
      if(due && due.getTime()<=Date.now()+1500){
        new Notification(r.title||'Reminder',{body:r.description||`${r.title} is due.`,tag:r.id});
      }
    }catch(e){console.warn('Web reminder notification failed:',e);}
    if(r.recurrence!=='none') armWebReminderTimer(r);
    else clearWebReminderTimer(r.id);
  },wait);
  return true;
}

async function scheduleReminderNotification(reminder){
  const r=normalizeReminder(reminder);
  const next=nextReminderOccurrence(r);
  if(!r.enabled||!next) return {ok:false,reason:'no-future-occurrence'};
  try{
    const b=notificationBridge();
    if(b?.scheduleReminder){
      const result=await b.scheduleReminder({
        id:r.id,title:r.title,
        body:r.description||`${r.title} is due.`,
        dueAt:next.toISOString(),recurrence:r.recurrence,
        interval:r.interval,intervalUnit:r.intervalUnit,
        triggerType:r.triggerType,triggerValue:r.triggerValue,
        timezone:r.timezone,snoozeMinutes:r.snoozeMinutes,
        deepLink:`personaltracker://finance/reminders/${encodeURIComponent(r.id)}`
      });
      // Do not report success unless the native bridge explicitly confirms it.
      if(result===false || result?.ok===false || result?.success===false){
        return {ok:false,reason:result?.reason||'native-schedule-rejected',native:true,result,next};
      }
      return {ok:true,native:true,result,next};
    }

    const granted=await requestReminderNotificationPermission();
    if(!granted) return {ok:false,reason:'permission-denied'};
    if(typeof Notification==='undefined') return {ok:false,reason:'notifications-unsupported'};
    if(Notification.permission!=='granted') return {ok:false,reason:'permission-denied'};
    if(!armWebReminderTimer(r)) return {ok:false,reason:'web-scheduler-unavailable'};
    return {ok:true,native:false,next};
  }catch(e){
    console.warn('Reminder scheduling failed:',e);
    return {ok:false,reason:e?.message||'schedule-failed'};
  }
}

async function cancelReminderNotification(id){
  try{
    const b=notificationBridge();
    if(b?.cancelReminder){
      const result=await b.cancelReminder({id});
      if(result===false || result?.ok===false) return false;
    }
    clearWebReminderTimer(id);
    return true;
  }catch(e){console.warn('Reminder cancellation failed:',e);return false;}
}

function RemindersTab({data,update,realMonthKey,realQuarterKey}){
  const [form,setForm]=useState(reminderDefaultForm());
  const [editing,setEditing]=useState(false);
  const [notice,setNotice]=useState('');
  const [permissionState,setPermissionState]=useState(notificationPermissionState());
  const reminders=(data.reminders||[]).map(normalizeReminder);
  const active=reminders.filter(r=>r.enabled);
  const paused=reminders.filter(r=>!r.enabled);

  // Re-arm already-granted web reminders whenever the Reminders screen opens.
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      const state=notificationPermissionState();
      if(!cancelled)setPermissionState(state);
      if(state==='granted' && !notificationBridge()){
        active.forEach(r=>armWebReminderTimer(r));
      }
    })();
    return ()=>{cancelled=true;};
  },[data.reminders?.length]);

  async function enableNotifications(){
    const granted=await requestReminderNotificationPermission();
    const state=notificationPermissionState();
    setPermissionState(state);
    if(!granted){
      setNotice(state==='denied'
        ? 'Notifications are blocked. Please allow notifications for this site/app in your device/browser settings.'
        : 'Notifications are not available in this environment.');
      return;
    }
    let ok=0,failed=0;
    for(const r of active){
      const result=await scheduleReminderNotification(r);
      if(result.ok)ok++;else failed++;
    }
    setNotice(failed
      ? `Notifications enabled. ${ok} reminder(s) scheduled; ${failed} could not be scheduled. ${notificationBridge()?'Check the APK notification bridge.':'Keep this web page open for web reminders.'}`
      : `Notifications enabled. ${ok} active reminder(s) scheduled.`);
  }

  async function saveReminder(){
    if(!form.title.trim()){setNotice('Please enter a reminder title.');return;}
    if(!form.date||!form.time){setNotice('Please select a date and time.');return;}
    const item=normalizeReminder({...form,title:form.title.trim(),description:form.description.trim()});
    update(d=>{
      if(!Array.isArray(d.reminders)) d.reminders=[];
      const i=d.reminders.findIndex(x=>x.id===item.id);
      if(i>=0)d.reminders[i]=item;else d.reminders.push(item);
    });
    const scheduled=await scheduleReminderNotification(item);
    setNotice(scheduled.ok
      ? `Saved. Next reminder: ${formatReminderDateTime(item)}`
      : scheduled.reason==='permission-denied'
        ? 'Saved, but notifications are blocked. Click Enable notifications and allow permission.'
        : scheduled.reason==='native-schedule-rejected'
          ? 'Saved, but the APK notification scheduler rejected the reminder. The APK notification bridge must be enabled.'
          : `Saved, but the reminder could not be scheduled (${scheduled.reason}).`);
    setForm(reminderDefaultForm());setEditing(false);
  }
  function editReminder(r){setForm(normalizeReminder(r));setEditing(true);setNotice('');}
  async function removeReminder(id){
    await cancelReminderNotification(id);
    update(d=>{d.reminders=(d.reminders||[]).filter(r=>r.id!==id);});
    if(form.id===id){setForm(reminderDefaultForm());setEditing(false);}
    setNotice('Reminder deleted.');
  }
  async function toggleReminder(r){
    const next=normalizeReminder({...r,enabled:!r.enabled});
    if(next.enabled)await scheduleReminderNotification(next);else await cancelReminderNotification(next.id);
    update(d=>{const t=d.reminders.find(x=>x.id===next.id);if(t)t.enabled=next.enabled;});
    setNotice(next.enabled?'Reminder resumed.':'Reminder paused.');
  }
  async function snoozeReminder(r){
    const minutes=Math.max(5,Number(r.snoozeMinutes||60));
    try{
      if(notificationBridge()?.snoozeReminder){
        await notificationBridge().snoozeReminder({id:r.id,minutes});
        setNotice(`Snoozed for ${minutes} minutes.`);return;
      }
    }catch(e){console.warn('Snooze failed:',e);}
    setNotice('Snooze will be available through the mobile notification bridge.');
  }
  function cancelForm(){setForm(reminderDefaultForm());setEditing(false);setNotice('');}

  return <div>
    <SectionTitle eyebrow="Personal notifications" title="Reminders"
      right={<button className="util-btn" onClick={enableNotifications}>
        {permissionState==='granted'?'Notifications enabled':'Enable notifications'}
      </button>}/>
    <div className="mb-4 text-xs rounded-lg p-3" style={{background:permissionState==='granted'?'#EEF8F3':'#FFF8EC',color:INK_SOFT}}>
      {notificationBridge()
        ? 'Mobile notification bridge detected.'
        : permissionState==='granted'
          ? 'Web notifications are enabled. Keep this page open for scheduled reminders.'
          : 'Notifications are not enabled yet.'}
    </div>

    <LedgerCard className="mb-5">
      <div className="eyebrow">{editing?'Edit reminder':'Create your own reminder'}</div>
      <div className="grid md:grid-cols-2 gap-3 mt-2">
        <div><div className="eyebrow">Title</div>
          <input className="ledger-input w-full" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="e.g. Pay electricity bill"/></div>
        <div><div className="eyebrow">Description</div>
          <input className="ledger-input w-full" value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Optional details"/></div>
        <div><div className="eyebrow">Date</div>
          <input type="date" className="ledger-input w-full" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
        <div><div className="eyebrow">Time</div>
          <input type="time" className="ledger-input w-full" value={form.time} onChange={e=>setForm({...form,time:e.target.value})}/></div>
        <div><div className="eyebrow">Recurrence</div>
          <select className="ledger-select w-full" value={form.recurrence} onChange={e=>setForm({...form,recurrence:e.target.value})}>
            {REMINDER_RECURRENCES.map(([v,l])=><option key={v} value={v}>{l}</option>)}
          </select></div>
        {form.recurrence==='custom'&&<div className="grid grid-cols-2 gap-2">
          <div><div className="eyebrow">Every</div><input type="number" min="1" className="ledger-input w-full" value={form.interval} onChange={e=>setForm({...form,interval:Math.max(1,Number(e.target.value)||1)})}/></div>
          <div><div className="eyebrow">Unit</div><select className="ledger-select w-full" value={form.intervalUnit} onChange={e=>setForm({...form,intervalUnit:e.target.value})}>
            <option value="days">Days</option><option value="weeks">Weeks</option><option value="months">Months</option><option value="years">Years</option>
          </select></div>
        </div>}
        <div><div className="eyebrow">Trigger</div>
          <select className="ledger-select w-full" value={form.triggerType} onChange={e=>setForm({...form,triggerType:e.target.value})}>
            {REMINDER_TRIGGERS.map(([v,l])=><option key={v} value={v}>{l}</option>)}
          </select></div>
        {form.triggerType!=='time'&&<div><div className="eyebrow">
          {form.triggerType==='event'?'Event name':form.triggerType==='location'?'Location / place':'Custom condition'}</div>
          <input className="ledger-input w-full" value={form.triggerValue} onChange={e=>setForm({...form,triggerValue:e.target.value})}
            placeholder={form.triggerType==='event'?'e.g. salary received':form.triggerType==='location'?'e.g. home or office':'e.g. balance below ₹10,000'}/></div>}
        <div><div className="eyebrow">Snooze</div>
          <select className="ledger-select w-full" value={form.snoozeMinutes} onChange={e=>setForm({...form,snoozeMinutes:Number(e.target.value)})}>
            <option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option><option value="180">3 hours</option><option value="1440">Tomorrow</option>
          </select></div>
        <div><div className="eyebrow">Timezone</div><input className="ledger-input w-full" value={form.timezone} readOnly/></div>
      </div>
      <div className="flex flex-wrap gap-2 mt-4">
        <button onClick={saveReminder} className="ledger-input font-mono text-sm" style={{background:INK,color:CARD,borderColor:INK,fontWeight:600}}>
          {editing?'Save changes':'+ Create reminder'}
        </button>
        {editing&&<button onClick={cancelForm} className="util-btn">Cancel</button>}
      </div>
      {notice&&<div className="mt-3 text-xs rounded-lg p-3" style={{background:'#F4F7FF',color:INK_SOFT}}>{notice}</div>}
    </LedgerCard>

    <LedgerCard className="mb-5">
      <SectionTitle eyebrow="Schedule preview" title="Upcoming reminders"/>
      <div className="space-y-2">
        {active.length===0&&<div className="text-sm" style={{color:INK_SOFT}}>No active reminders. Create one above.</div>}
        {active.slice().sort((a,b)=>(nextReminderOccurrence(a)?.getTime()||Infinity)-(nextReminderOccurrence(b)?.getTime()||Infinity)).map(r=>
          <div key={r.id} className="row-line py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-2">
            <div><div className="font-semibold text-sm">{r.title}</div>
              <div className="text-xs mt-1" style={{color:INK_SOFT}}>{r.description||'No description'} · {r.triggerType} · {r.recurrence}</div>
              <div className="text-xs mt-1 font-mono" style={{color:BRASS}}>Next: {formatReminderDateTime(r)} · {r.timezone}</div>
            </div>
            <div className="flex gap-2 flex-wrap">
              <button className="util-btn" onClick={()=>snoozeReminder(r)}>Snooze</button>
              <button className="util-btn" onClick={()=>toggleReminder(r)}>Pause</button>
              <button className="util-btn" onClick={()=>editReminder(r)}>Edit</button>
              <button className="util-btn" style={{color:BAD}} onClick={()=>removeReminder(r.id)}>Delete</button>
            </div>
          </div>)}
      </div>
    </LedgerCard>

    {paused.length>0&&<LedgerCard>
      <SectionTitle eyebrow="Paused" title="Paused reminders"/>
      <div className="space-y-2">{paused.map(r=>
        <div key={r.id} className="row-line py-3 flex items-center justify-between gap-2">
          <div><div className="font-semibold text-sm">{r.title}</div><div className="text-xs" style={{color:INK_SOFT}}>Paused · {r.recurrence} · {r.timezone}</div></div>
          <div className="flex gap-2"><button className="util-btn" onClick={()=>toggleReminder(r)}>Resume</button>
            <button className="util-btn" onClick={()=>editReminder(r)}>Edit</button>
            <button className="util-btn" style={{color:BAD}} onClick={()=>removeReminder(r.id)}>Delete</button></div>
        </div>)}</div>
    </LedgerCard>}
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
