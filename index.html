<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Command Center — Life OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=24 height=24 rx=6 fill=%22%230A0E13%22/><path d=%22M12 3l1.8 5.3L19 10l-5.2 1.7L12 17l-1.8-5.3L5 10l5.2-1.7z%22 fill=%22%232FE0C4%22/></svg>" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { background: #0A0E13; margin: 0; }
  * { box-sizing: border-box; }
  .lc-mono { font-family: 'JetBrains Mono', monospace; }
  .lc-display { font-family: 'Space Grotesk', sans-serif; }
  .lc-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
  .lc-scroll::-webkit-scrollbar-thumb { background: #232C38; border-radius: 999px; }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useRef, useCallback } from "https://esm.sh/react@18";
import { createRoot } from "https://esm.sh/react-dom@18/client";
import {
  LayoutDashboard, CheckSquare, Target, Flame, Briefcase, StickyNote,
  Plus, Trash2, X, Calendar, TrendingUp, Droplet, BookOpen, Dumbbell,
  Brain, Code2, Sparkles, GripVertical, Check, ChevronDown, Clock,
  ArrowRight, Building2,
} from "https://esm.sh/lucide-react@0.383.0?deps=react@18";
import {
  BarChart, Bar, XAxis, YAxis, ResponsiveContainer, Tooltip, CartesianGrid,
} from "https://esm.sh/recharts@2.12.7?deps=react@18,react-dom@18";

/* ---------------------------------------------------------------------- */
/* Theme + constants                                                      */
/* ---------------------------------------------------------------------- */

const T = {
  bg: "#0A0E13",
  surface: "#12181F",
  surfaceAlt: "#1A222C",
  border: "#232C38",
  borderSoft: "#1B232E",
  text: "#E7ECF2",
  muted: "#8492A3",
  faint: "#4E5B6C",
  teal: "#2FE0C4",
  tealDim: "#1B3B36",
  amber: "#F5A623",
  amberDim: "#3B2E14",
  coral: "#FB7185",
  coralDim: "#3A1E23",
  green: "#3DDC97",
  greenDim: "#173629",
  violet: "#A78BFA",
  violetDim: "#2A2340",
};

const STORAGE_KEY = "lifeos:v1:data";

const STAGES = ["Wishlist", "Applied", "Screening", "Interview", "Final Round", "Offer", "Closed"];

const HABIT_ICONS = { droplet: Droplet, book: BookOpen, dumbbell: Dumbbell, brain: Brain, code: Code2, sparkles: Sparkles };

const NAV = [
  { id: "dashboard", label: "Dashboard", icon: LayoutDashboard },
  { id: "tasks", label: "Tasks", icon: CheckSquare },
  { id: "goals", label: "Goals", icon: Target },
  { id: "habits", label: "Habits", icon: Flame },
  { id: "career", label: "Career", icon: Briefcase },
  { id: "notes", label: "Notes", icon: StickyNote },
];

/* ---------------------------------------------------------------------- */
/* Helpers                                                                 */
/* ---------------------------------------------------------------------- */

const uid = () => Math.random().toString(36).slice(2, 10);
const isoDate = (d = new Date()) => d.toISOString().slice(0, 10);
const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return isoDate(d); };
const fmtShort = (iso) => { if (!iso) return ""; const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
const dayLabel = (iso) => { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 2); };

/* Local persistence — plain localStorage, wrapped to look async so the
   rest of the app doesn't care whether storage is local or remote. */
const storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
};

function defaultData() {
  const t0 = daysAgo(0), t1 = daysAgo(1), t2 = daysAgo(2);
  return {
    tasks: [
      { id: uid(), title: "Finish dashboard mockups", priority: "high", done: false, dueDate: daysAgo(-1), category: "Projects", createdAt: t2 },
      { id: uid(), title: "Reply to recruiter email", priority: "high", done: false, dueDate: t0, category: "Career", createdAt: t2 },
      { id: uid(), title: "Read two chapters", priority: "medium", done: false, dueDate: daysAgo(-2), category: "Learning", createdAt: t1 },
      { id: uid(), title: "Grocery run", priority: "low", done: false, dueDate: null, category: "Personal", createdAt: t1 },
      { id: uid(), title: "Set up project repo", priority: "medium", done: true, dueDate: null, category: "Projects", createdAt: t2, completedAt: t1 },
      { id: uid(), title: "Morning workout", priority: "low", done: true, dueDate: null, category: "Health", createdAt: t0, completedAt: t0 },
      { id: uid(), title: "Plan the week", priority: "medium", done: true, dueDate: null, category: "Personal", createdAt: t0, completedAt: t0 },
    ],
    goals: [
      { id: uid(), name: "Land a new role", category: "Career", progress: 72 },
      { id: uid(), name: "Ship the Life OS build", category: "Personal Projects", progress: 58 },
      { id: uid(), name: "Finish the systems design course", category: "Learning", progress: 41 },
    ],
    habits: [
      { id: uid(), name: "Water", icon: "droplet", doneDates: [t0, t1, t2] },
      { id: uid(), name: "Learning", icon: "book", doneDates: [t0, t2] },
      { id: uid(), name: "Exercise", icon: "dumbbell", doneDates: [t0, t1] },
      { id: uid(), name: "Meditation", icon: "brain", doneDates: [t1] },
      { id: uid(), name: "Project work", icon: "code", doneDates: [t0, t1, t2] },
    ],
    career: [
      { id: uid(), company: "Nimbus Analytics", role: "Frontend Engineer", appliedDate: daysAgo(10), recruiter: "Priya Menon", stage: "Interview", notes: "Second round scheduled.", followUpDate: daysAgo(-3) },
      { id: uid(), company: "Fieldstone", role: "Product Designer", appliedDate: daysAgo(18), recruiter: "", stage: "Applied", notes: "", followUpDate: daysAgo(-1) },
      { id: uid(), company: "Kestrel Labs", role: "Full Stack Developer", appliedDate: daysAgo(4), recruiter: "Sam O.", stage: "Screening", notes: "Phone screen went well.", followUpDate: null },
      { id: uid(), company: "Willow & Co", role: "UX Engineer", appliedDate: daysAgo(30), recruiter: "", stage: "Wishlist", notes: "Dream company, wait for referral.", followUpDate: null },
      { id: uid(), company: "Anchorpoint", role: "Software Engineer", appliedDate: daysAgo(25), recruiter: "Dana K.", stage: "Closed", notes: "Went with another candidate.", followUpDate: null },
    ],
    notes: [
      { id: uid(), text: "Idea: weekly review ritual every Sunday evening", type: "idea", createdAt: t1 },
      { id: uid(), text: "Ask about relocation policy at Nimbus", type: "reminder", createdAt: t0 },
      { id: uid(), text: "Book recommendation from Dana: Designing Data-Intensive Applications", type: "note", createdAt: t2 },
    ],
  };
}

/* ---------------------------------------------------------------------- */
/* Small building blocks                                                  */
/* ---------------------------------------------------------------------- */

function Card({ children, style, className = "" }) {
  return (
    <div
      className={`rounded-2xl ${className}`}
      style={{ background: T.surface, border: `1px solid ${T.border}`, ...style }}
    >
      {children}
    </div>
  );
}

function SectionLabel({ children }) {
  return (
    <div className="uppercase tracking-widest text-xs font-medium mb-3" style={{ color: T.faint, letterSpacing: "0.12em" }}>
      {children}
    </div>
  );
}

function ProgressBar({ value, color = T.teal }) {
  return (
    <div className="w-full h-1.5 rounded-full overflow-hidden" style={{ background: T.surfaceAlt }}>
      <div className="h-full rounded-full transition-all" style={{ width: `${Math.max(0, Math.min(100, value))}%`, background: color }} />
    </div>
  );
}

function PriorityDot({ priority }) {
  const c = priority === "high" ? T.coral : priority === "medium" ? T.amber : T.muted;
  return <span className="inline-block w-2 h-2 rounded-full flex-shrink-0" style={{ background: c }} />;
}

function IconBtn({ onClick, title, children }) {
  return (
    <button
      onClick={onClick}
      title={title}
      className="w-7 h-7 flex items-center justify-center rounded-lg transition-colors flex-shrink-0"
      style={{ color: T.faint }}
      onMouseEnter={(e) => { e.currentTarget.style.color = T.coral; e.currentTarget.style.background = T.coralDim; }}
      onMouseLeave={(e) => { e.currentTarget.style.color = T.faint; e.currentTarget.style.background = "transparent"; }}
    >
      {children}
    </button>
  );
}

function TextInput(props) {
  return (
    <input
      {...props}
      className={`w-full px-3 py-2 rounded-lg text-sm outline-none transition-colors ${props.className || ""}`}
      style={{ background: T.surfaceAlt, border: `1px solid ${T.border}`, color: T.text, ...props.style }}
    />
  );
}

function Select({ value, onChange, options, style }) {
  return (
    <select
      value={value}
      onChange={onChange}
      className="px-3 py-2 rounded-lg text-sm outline-none"
      style={{ background: T.surfaceAlt, border: `1px solid ${T.border}`, color: T.text, ...style }}
    >
      {options.map((o) => (
        <option key={o.value} value={o.value}>{o.label}</option>
      ))}
    </select>
  );
}

function PrimaryButton({ onClick, children, type = "button", full }) {
  return (
    <button
      type={type}
      onClick={onClick}
      className={`px-4 py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-1.5 transition-opacity hover:opacity-90 ${full ? "w-full" : ""}`}
      style={{ background: T.teal, color: "#062622" }}
    >
      {children}
    </button>
  );
}

/* ---------------------------------------------------------------------- */
/* Root component                                                         */
/* ---------------------------------------------------------------------- */

function LifeCommandCenter() {
  const [tab, setTab] = useState("dashboard");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveState, setSaveState] = useState("idle");
  const saveTimer = useRef(null);
  const loadedOnce = useRef(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(STORAGE_KEY);
        setData(res ? JSON.parse(res.value) : defaultData());
      } catch (e) {
        setData(defaultData());
      } finally {
        setLoading(false);
        loadedOnce.current = true;
      }
    })();
  }, []);

  useEffect(() => {
    if (!loadedOnce.current || !data) return;
    setSaveState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await storage.set(STORAGE_KEY, JSON.stringify(data));
        setSaveState("saved");
      } catch (e) {
        setSaveState("idle");
      }
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [data]);

  const update = useCallback((fn) => setData((d) => fn(structuredClone(d))), []);

  if (loading || !data) {
    return (
      <div className="w-full h-full flex items-center justify-center" style={{ background: T.bg, minHeight: "100vh" }}>
        <div className="flex items-center gap-3" style={{ color: T.muted }}>
          <div className="w-4 h-4 rounded-full animate-spin" style={{ border: `2px solid ${T.border}`, borderTopColor: T.teal }} />
          <span className="text-sm">Loading your command center…</span>
        </div>
      </div>
    );
  }

  return (
    <div className="w-full flex flex-col md:flex-row" style={{ background: T.bg, minHeight: "100vh", fontFamily: "'Inter', sans-serif" }}>
      <Sidebar tab={tab} setTab={setTab} saveState={saveState} />

      <main className="flex-1 p-4 sm:p-6 md:p-8 overflow-x-hidden">
        {tab === "dashboard" && <Dashboard data={data} update={update} setTab={setTab} />}
        {tab === "tasks" && <TasksView data={data} update={update} />}
        {tab === "goals" && <GoalsView data={data} update={update} />}
        {tab === "habits" && <HabitsView data={data} update={update} />}
        {tab === "career" && <CareerView data={data} update={update} />}
        {tab === "notes" && <NotesView data={data} update={update} />}
      </main>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Sidebar                                                                 */
/* ---------------------------------------------------------------------- */

function Sidebar({ tab, setTab, saveState }) {
  return (
    <aside
      className="md:w-56 md:flex-shrink-0 flex md:flex-col justify-between px-3 sm:px-4 py-3 md:py-6 overflow-x-auto lc-scroll"
      style={{ background: T.surface, borderBottom: `1px solid ${T.border}`, borderRight: `1px solid ${T.border}` }}
    >
      <div className="flex md:flex-col items-center md:items-stretch gap-1 md:gap-1">
        <div className="hidden md:flex items-center gap-2 px-2 mb-6">
          <div className="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: T.tealDim }}>
            <Sparkles size={14} style={{ color: T.teal }} />
          </div>
          <span className="lc-display font-semibold text-sm tracking-tight" style={{ color: T.text }}>Command Center</span>
        </div>
        {NAV.map((n) => {
          const Icon = n.icon;
          const active = tab === n.id;
          return (
            <button
              key={n.id}
              onClick={() => setTab(n.id)}
              className="flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm font-medium transition-colors flex-shrink-0 whitespace-nowrap"
              style={{ background: active ? T.surfaceAlt : "transparent", color: active ? T.teal : T.muted }}
            >
              <Icon size={16} />
              <span>{n.label}</span>
            </button>
          );
        })}
      </div>
      <div className="hidden md:flex items-center gap-2 px-3 pt-4 text-xs" style={{ color: T.faint, borderTop: `1px solid ${T.borderSoft}` }}>
        <span className="w-1.5 h-1.5 rounded-full" style={{ background: saveState === "saving" ? T.amber : T.green }} />
        <span className="lc-mono">{saveState === "saving" ? "saving…" : "synced locally"}</span>
      </div>
    </aside>
  );
}

/* ---------------------------------------------------------------------- */
/* Dashboard                                                               */
/* ---------------------------------------------------------------------- */

function greeting() {
  const h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 18) return "Good afternoon";
  return "Good evening";
}

function Dashboard({ data, update, setTab }) {
  const today = isoDate();
  const highPending = data.tasks.filter((t) => !t.done && t.priority === "high").length;
  const otherPending = data.tasks.filter((t) => !t.done && t.priority !== "high").length;
  const completedToday = data.tasks.filter((t) => t.done && t.completedAt === today).length;

  const upcoming = [
    ...data.tasks.filter((t) => !t.done && t.dueDate).map((t) => ({ id: t.id, label: t.title, date: t.dueDate, kind: "Task" })),
    ...data.career.filter((c) => c.followUpDate).map((c) => ({ id: c.id, label: `Follow up — ${c.company}`, date: c.followUpDate, kind: "Career" })),
  ].sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5);

  const last7 = Array.from({ length: 7 }, (_, i) => daysAgo(6 - i));
  const chartData = last7.map((d) => ({
    day: dayLabel(d),
    completed: data.tasks.filter((t) => t.done && t.completedAt === d).length,
  }));

  const habitCells = last7;
  const habitConsistency = Math.round(
    (data.habits.reduce((sum, h) => sum + habitCells.filter((d) => h.doneDates.includes(d)).length, 0) /
      Math.max(1, data.habits.length * habitCells.length)) * 100
  );
  const avgGoalProgress = Math.round(data.goals.reduce((s, g) => s + g.progress, 0) / Math.max(1, data.goals.length));

  const [captureText, setCaptureText] = useState("");
  const [captureType, setCaptureType] = useState("idea");

  const addCapture = () => {
    const text = captureText.trim();
    if (!text) return;
    update((d) => {
      d.notes.unshift({ id: uid(), text, type: captureType, createdAt: today });
      if (captureType === "task") {
        d.tasks.unshift({ id: uid(), title: text, priority: "medium", done: false, dueDate: null, category: "Inbox", createdAt: today });
      }
      return d;
    });
    setCaptureText("");
  };

  return (
    <div className="max-w-6xl mx-auto flex flex-col gap-6">
      <div>
        <h1 className="lc-display text-2xl sm:text-3xl font-semibold" style={{ color: T.text }}>
          {greeting()} <span style={{ color: T.teal }}>👋</span>
        </h1>
        <p className="text-sm mt-1 lc-mono" style={{ color: T.faint }}>
          {new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}
        </p>
      </div>

      <div>
        <SectionLabel>Today's focus</SectionLabel>
        <div className="grid grid-cols-3 gap-3 sm:gap-4">
          <StatCard color={T.coral} value={highPending} label="High priority" onClick={() => setTab("tasks")} />
          <StatCard color={T.amber} value={otherPending} label="Pending" onClick={() => setTab("tasks")} />
          <StatCard color={T.green} value={completedToday} label="Completed today" onClick={() => setTab("tasks")} />
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <Card style={{ padding: 20 }}>
          <div className="flex items-center justify-between mb-4">
            <SectionLabel>My goals</SectionLabel>
            <span className="text-xs lc-mono" style={{ color: T.faint }}>avg {avgGoalProgress}%</span>
          </div>
          <div className="flex flex-col gap-4">
            {data.goals.map((g) => (
              <div key={g.id}>
                <div className="flex items-center justify-between text-sm mb-1.5">
                  <span style={{ color: T.text }}>{g.name}</span>
                  <span className="lc-mono text-xs" style={{ color: T.muted }}>{g.progress}%</span>
                </div>
                <ProgressBar value={g.progress} color={T.violet} />
              </div>
            ))}
            {data.goals.length === 0 && <EmptyHint text="No goals yet. Add one from the Goals tab." />}
          </div>
        </Card>

        <Card style={{ padding: 20 }}>
          <div className="flex items-center justify-between mb-4">
            <SectionLabel>Habits today</SectionLabel>
            <span className="text-xs lc-mono" style={{ color: T.faint }}>{habitConsistency}% this week</span>
          </div>
          <div className="flex flex-col gap-2.5">
            {data.habits.map((h) => {
              const Icon = HABIT_ICONS[h.icon] || Sparkles;
              const done = h.doneDates.includes(today);
              return (
                <button
                  key={h.id}
                  onClick={() => update((d) => {
                    const habit = d.habits.find((x) => x.id === h.id);
                    habit.doneDates = done ? habit.doneDates.filter((x) => x !== today) : [...habit.doneDates, today];
                    return d;
                  })}
                  className="flex items-center gap-3 text-sm px-2 py-1.5 rounded-lg transition-colors"
                  style={{ background: done ? T.tealDim : "transparent" }}
                >
                  <span className="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: done ? "transparent" : T.surfaceAlt, color: done ? T.teal : T.muted }}>
                    {done ? <Check size={14} /> : <Icon size={14} />}
                  </span>
                  <span style={{ color: done ? T.text : T.muted }}>{h.name}</span>
                </button>
              );
            })}
          </div>
        </Card>

        <Card style={{ padding: 20 }}>
          <SectionLabel>Upcoming</SectionLabel>
          <div className="flex flex-col gap-3">
            {upcoming.map((u) => (
              <div key={u.id + u.kind} className="flex items-center justify-between text-sm gap-2">
                <div className="flex items-center gap-2 min-w-0">
                  <Calendar size={13} style={{ color: T.faint, flexShrink: 0 }} />
                  <span className="truncate" style={{ color: T.text }}>{u.label}</span>
                </div>
                <span className="lc-mono text-xs flex-shrink-0" style={{ color: T.muted }}>{fmtShort(u.date)}</span>
              </div>
            ))}
            {upcoming.length === 0 && <EmptyHint text="Nothing scheduled. Add due dates to see them here." />}
          </div>
        </Card>
      </div>

      <Card style={{ padding: 20 }}>
        <SectionLabel>Quick capture</SectionLabel>
        <div className="flex flex-col sm:flex-row gap-2">
          <TextInput
            placeholder="Add an idea, task, note, or reminder…"
            value={captureText}
            onChange={(e) => setCaptureText(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addCapture()}
          />
          <div className="flex gap-2">
            <Select
              value={captureType}
              onChange={(e) => setCaptureType(e.target.value)}
              options={[
                { value: "idea", label: "Idea" },
                { value: "task", label: "Task" },
                { value: "note", label: "Note" },
                { value: "reminder", label: "Reminder" },
              ]}
            />
            <PrimaryButton onClick={addCapture}><Plus size={15} /> Add</PrimaryButton>
          </div>
        </div>
      </Card>

      <Card style={{ padding: 20 }}>
        <div className="flex items-center justify-between mb-4">
          <SectionLabel>Weekly analytics</SectionLabel>
          <TrendingUp size={14} style={{ color: T.faint }} />
        </div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div className="md:col-span-2 h-44">
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={chartData} margin={{ top: 4, right: 4, left: -20, bottom: 0 }}>
                <CartesianGrid vertical={false} stroke={T.borderSoft} />
                <XAxis dataKey="day" tick={{ fill: T.faint, fontSize: 11 }} axisLine={{ stroke: T.border }} tickLine={false} />
                <YAxis tick={{ fill: T.faint, fontSize: 11 }} axisLine={false} tickLine={false} allowDecimals={false} />
                <Tooltip contentStyle={{ background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 8, fontSize: 12, color: T.text }} cursor={{ fill: T.surfaceAlt }} />
                <Bar dataKey="completed" name="Tasks completed" fill={T.teal} radius={[4, 4, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
          <div className="flex flex-col justify-center gap-4">
            <MetricRow label="Tasks completed" value={chartData.reduce((s, c) => s + c.completed, 0)} />
            <MetricRow label="Habit consistency" value={`${habitConsistency}%`} />
            <MetricRow label="Avg. goal progress" value={`${avgGoalProgress}%`} />
          </div>
        </div>
      </Card>
    </div>
  );
}

function StatCard({ color, value, label, onClick }) {
  return (
    <button onClick={onClick} className="text-left rounded-2xl p-4 sm:p-5 transition-transform hover:-translate-y-0.5" style={{ background: T.surface, border: `1px solid ${T.border}` }}>
      <div className="flex items-center gap-2 mb-2">
        <span className="w-2 h-2 rounded-full" style={{ background: color }} />
        <span className="lc-mono text-2xl sm:text-3xl font-medium" style={{ color: T.text }}>{value}</span>
      </div>
      <div className="text-xs sm:text-sm" style={{ color: T.muted }}>{label}</div>
    </button>
  );
}

function MetricRow({ label, value }) {
  return (
    <div className="flex items-center justify-between">
      <span className="text-sm" style={{ color: T.muted }}>{label}</span>
      <span className="lc-mono text-sm font-medium" style={{ color: T.text }}>{value}</span>
    </div>
  );
}

function EmptyHint({ text }) {
  return <p className="text-sm" style={{ color: T.faint }}>{text}</p>;
}

/* ---------------------------------------------------------------------- */
/* Tasks                                                                   */
/* ---------------------------------------------------------------------- */

function TasksView({ data, update }) {
  const [filter, setFilter] = useState("all");
  const [title, setTitle] = useState("");
  const [priority, setPriority] = useState("medium");
  const [dueDate, setDueDate] = useState("");
  const [category, setCategory] = useState("");

  const addTask = () => {
    if (!title.trim()) return;
    update((d) => {
      d.tasks.unshift({ id: uid(), title: title.trim(), priority, done: false, dueDate: dueDate || null, category: category.trim() || "General", createdAt: isoDate() });
      return d;
    });
    setTitle(""); setDueDate(""); setCategory("");
  };

  const toggleDone = (id) => update((d) => {
    const t = d.tasks.find((x) => x.id === id);
    t.done = !t.done;
    t.completedAt = t.done ? isoDate() : undefined;
    return d;
  });
  const removeTask = (id) => update((d) => { d.tasks = d.tasks.filter((x) => x.id !== id); return d; });

  const filtered = data.tasks.filter((t) => {
    if (filter === "pending") return !t.done;
    if (filter === "done") return t.done;
    if (filter === "high") return t.priority === "high" && !t.done;
    return true;
  }).sort((a, b) => (a.done === b.done ? 0 : a.done ? 1 : -1));

  return (
    <div className="max-w-4xl mx-auto flex flex-col gap-6">
      <ViewHeader title="Tasks" subtitle={`${data.tasks.filter((t) => !t.done).length} pending · ${data.tasks.filter((t) => t.done).length} completed`} />

      <Card style={{ padding: 20 }}>
        <div className="flex flex-col sm:flex-row gap-2 mb-3">
          <TextInput placeholder="What needs doing?" value={title} onChange={(e) => setTitle(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addTask()} />
        </div>
        <div className="flex flex-wrap gap-2">
          <Select value={priority} onChange={(e) => setPriority(e.target.value)} options={[{ value: "high", label: "High priority" }, { value: "medium", label: "Medium priority" }, { value: "low", label: "Low priority" }]} />
          <TextInput type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)} className="w-auto" style={{ width: 150 }} />
          <TextInput placeholder="Category" value={category} onChange={(e) => setCategory(e.target.value)} className="w-auto" style={{ width: 140 }} />
          <PrimaryButton onClick={addTask}><Plus size={15} /> Add task</PrimaryButton>
        </div>
      </Card>

      <div className="flex gap-2 lc-scroll overflow-x-auto pb-1">
        {[{ id: "all", label: "All" }, { id: "pending", label: "Pending" }, { id: "high", label: "High priority" }, { id: "done", label: "Completed" }].map((f) => (
          <button key={f.id} onClick={() => setFilter(f.id)} className="px-3 py-1.5 rounded-lg text-sm flex-shrink-0" style={{ background: filter === f.id ? T.surfaceAlt : "transparent", color: filter === f.id ? T.teal : T.muted, border: `1px solid ${filter === f.id ? T.border : "transparent"}` }}>
            {f.label}
          </button>
        ))}
      </div>

      <Card>
        {filtered.length === 0 && <div className="p-6"><EmptyHint text="No tasks here. Add one above to get started." /></div>}
        {filtered.map((t, i) => (
          <div key={t.id} className="flex items-center gap-3 px-4 py-3" style={{ borderTop: i === 0 ? "none" : `1px solid ${T.borderSoft}` }}>
            <button onClick={() => toggleDone(t.id)} className="w-5 h-5 rounded-md flex items-center justify-center flex-shrink-0" style={{ border: `1.5px solid ${t.done ? T.green : T.border}`, background: t.done ? T.green : "transparent" }}>
              {t.done && <Check size={12} color="#062622" />}
            </button>
            <PriorityDot priority={t.priority} />
            <div className="flex-1 min-w-0">
              <div className="text-sm truncate" style={{ color: t.done ? T.faint : T.text, textDecoration: t.done ? "line-through" : "none" }}>{t.title}</div>
              <div className="flex gap-2 text-xs mt-0.5 lc-mono" style={{ color: T.faint }}>
                <span>{t.category}</span>
                {t.dueDate && <span>· due {fmtShort(t.dueDate)}</span>}
              </div>
            </div>
            <IconBtn onClick={() => removeTask(t.id)} title="Delete"><Trash2 size={14} /></IconBtn>
          </div>
        ))}
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Goals                                                                   */
/* ---------------------------------------------------------------------- */

function GoalsView({ data, update }) {
  const [name, setName] = useState("");
  const [category, setCategory] = useState("");

  const addGoal = () => {
    if (!name.trim()) return;
    update((d) => { d.goals.push({ id: uid(), name: name.trim(), category: category.trim() || "General", progress: 0 }); return d; });
    setName(""); setCategory("");
  };
  const setProgress = (id, value) => update((d) => { d.goals.find((g) => g.id === id).progress = value; return d; });
  const removeGoal = (id) => update((d) => { d.goals = d.goals.filter((g) => g.id !== id); return d; });

  return (
    <div className="max-w-3xl mx-auto flex flex-col gap-6">
      <ViewHeader title="Goals" subtitle={`${data.goals.length} tracked`} />

      <Card style={{ padding: 20 }}>
        <div className="flex flex-col sm:flex-row gap-2">
          <TextInput placeholder="Goal name" value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addGoal()} />
          <TextInput placeholder="Category" value={category} onChange={(e) => setCategory(e.target.value)} className="sm:w-48" />
          <PrimaryButton onClick={addGoal}><Plus size={15} /> Add goal</PrimaryButton>
        </div>
      </Card>

      <div className="flex flex-col gap-3">
        {data.goals.length === 0 && <Card style={{ padding: 20 }}><EmptyHint text="No goals yet. Add your first one above." /></Card>}
        {data.goals.map((g) => (
          <Card key={g.id} style={{ padding: 20 }}>
            <div className="flex items-center justify-between gap-3 mb-2">
              <div>
                <div className="text-sm font-medium" style={{ color: T.text }}>{g.name}</div>
                <div className="text-xs lc-mono mt-0.5" style={{ color: T.faint }}>{g.category}</div>
              </div>
              <div className="flex items-center gap-3">
                <span className="lc-mono text-sm" style={{ color: T.violet }}>{g.progress}%</span>
                <IconBtn onClick={() => removeGoal(g.id)} title="Delete"><Trash2 size={14} /></IconBtn>
              </div>
            </div>
            <input type="range" min="0" max="100" value={g.progress} onChange={(e) => setProgress(g.id, Number(e.target.value))} className="w-full" style={{ accentColor: T.violet }} />
          </Card>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Habits                                                                  */
/* ---------------------------------------------------------------------- */

function streak(doneDates) {
  let s = 0, d = new Date();
  while (doneDates.includes(isoDate(d))) { s++; d.setDate(d.getDate() - 1); }
  return s;
}

function HabitsView({ data, update }) {
  const [name, setName] = useState("");
  const [icon, setIcon] = useState("sparkles");
  const last7 = Array.from({ length: 7 }, (_, i) => daysAgo(6 - i));

  const addHabit = () => {
    if (!name.trim()) return;
    update((d) => { d.habits.push({ id: uid(), name: name.trim(), icon, doneDates: [] }); return d; });
    setName("");
  };
  const toggle = (id, date) => update((d) => {
    const h = d.habits.find((x) => x.id === id);
    h.doneDates = h.doneDates.includes(date) ? h.doneDates.filter((x) => x !== date) : [...h.doneDates, date];
    return d;
  });
  const removeHabit = (id) => update((d) => { d.habits = d.habits.filter((h) => h.id !== id); return d; });

  return (
    <div className="max-w-4xl mx-auto flex flex-col gap-6">
      <ViewHeader title="Habits" subtitle={`${data.habits.length} tracked`} />

      <Card style={{ padding: 20 }}>
        <div className="flex flex-col sm:flex-row gap-2">
          <TextInput placeholder="New habit name" value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addHabit()} />
          <Select value={icon} onChange={(e) => setIcon(e.target.value)} options={Object.keys(HABIT_ICONS).map((k) => ({ value: k, label: k[0].toUpperCase() + k.slice(1) }))} />
          <PrimaryButton onClick={addHabit}><Plus size={15} /> Add habit</PrimaryButton>
        </div>
      </Card>

      <Card style={{ padding: "12px 20px" }}>
        {data.habits.length === 0 && <div className="py-8"><EmptyHint text="No habits yet. Add one above to start tracking." /></div>}
        {data.habits.map((h, i) => {
          const Icon = HABIT_ICONS[h.icon] || Sparkles;
          return (
            <div key={h.id} className="flex items-center gap-3 sm:gap-4 py-3 flex-wrap" style={{ borderTop: i === 0 ? "none" : `1px solid ${T.borderSoft}` }}>
              <div className="flex items-center gap-2.5 min-w-[150px]">
                <span className="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: T.surfaceAlt, color: T.teal }}><Icon size={15} /></span>
                <div>
                  <div className="text-sm" style={{ color: T.text }}>{h.name}</div>
                  <div className="text-xs lc-mono flex items-center gap-1" style={{ color: T.amber }}><Flame size={11} />{streak(h.doneDates)} day streak</div>
                </div>
              </div>
              <div className="flex gap-1.5 ml-auto">
                {last7.map((d) => {
                  const on = h.doneDates.includes(d);
                  return (
                    <button key={d} onClick={() => toggle(h.id, d)} title={d} className="w-7 h-7 rounded-md flex items-center justify-center text-xs" style={{ background: on ? T.tealDim : T.surfaceAlt, color: on ? T.teal : T.faint, border: `1px solid ${on ? T.teal : T.border}` }}>
                      {dayLabel(d)[0]}
                    </button>
                  );
                })}
              </div>
              <IconBtn onClick={() => removeHabit(h.id)} title="Delete"><Trash2 size={14} /></IconBtn>
            </div>
          );
        })}
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Career (kanban)                                                         */
/* ---------------------------------------------------------------------- */

function CareerView({ data, update }) {
  const [form, setForm] = useState({ company: "", role: "", recruiter: "", followUpDate: "" });
  const [dragId, setDragId] = useState(null);

  const counts = STAGES.reduce((acc, s) => ({ ...acc, [s]: data.career.filter((c) => c.stage === s).length }), {});

  const addApp = () => {
    if (!form.company.trim() || !form.role.trim()) return;
    update((d) => {
      d.career.unshift({ id: uid(), company: form.company.trim(), role: form.role.trim(), appliedDate: isoDate(), recruiter: form.recruiter.trim(), stage: "Wishlist", notes: "", followUpDate: form.followUpDate || null });
      return d;
    });
    setForm({ company: "", role: "", recruiter: "", followUpDate: "" });
  };
  const removeApp = (id) => update((d) => { d.career = d.career.filter((c) => c.id !== id); return d; });
  const moveApp = (id, stage) => update((d) => { d.career.find((c) => c.id === id).stage = stage; return d; });

  return (
    <div className="max-w-6xl mx-auto flex flex-col gap-6">
      <ViewHeader title="Career" subtitle={`${data.career.length} applications tracked`} />

      <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
        {STAGES.map((s) => (
          <Card key={s} style={{ padding: 12 }}>
            <div className="lc-mono text-xl font-medium" style={{ color: T.text }}>{counts[s]}</div>
            <div className="text-xs mt-0.5" style={{ color: T.muted }}>{s}</div>
          </Card>
        ))}
      </div>

      <Card style={{ padding: 20 }}>
        <SectionLabel>Add application</SectionLabel>
        <div className="flex flex-col sm:flex-row gap-2">
          <TextInput placeholder="Company" value={form.company} onChange={(e) => setForm({ ...form, company: e.target.value })} />
          <TextInput placeholder="Role" value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })} />
          <TextInput placeholder="Recruiter (optional)" value={form.recruiter} onChange={(e) => setForm({ ...form, recruiter: e.target.value })} />
          <TextInput type="date" value={form.followUpDate} onChange={(e) => setForm({ ...form, followUpDate: e.target.value })} className="sm:w-40" />
          <PrimaryButton onClick={addApp}><Plus size={15} /> Add</PrimaryButton>
        </div>
      </Card>

      <div className="flex gap-4 overflow-x-auto pb-2 lc-scroll">
        {STAGES.map((stage) => (
          <div
            key={stage}
            onDragOver={(e) => e.preventDefault()}
            onDrop={() => { if (dragId) moveApp(dragId, stage); setDragId(null); }}
            className="flex-shrink-0 w-64 sm:w-72 rounded-2xl p-3"
            style={{ background: T.surfaceAlt, border: `1px solid ${T.borderSoft}`, minHeight: 120 }}
          >
            <div className="flex items-center justify-between px-1 mb-3">
              <span className="text-xs font-medium uppercase tracking-wide" style={{ color: T.muted, letterSpacing: "0.08em" }}>{stage}</span>
              <span className="lc-mono text-xs" style={{ color: T.faint }}>{counts[stage]}</span>
            </div>
            <div className="flex flex-col gap-2">
              {data.career.filter((c) => c.stage === stage).map((c) => (
                <div
                  key={c.id}
                  draggable
                  onDragStart={() => setDragId(c.id)}
                  className="rounded-xl p-3 cursor-grab active:cursor-grabbing"
                  style={{ background: T.surface, border: `1px solid ${T.border}` }}
                >
                  <div className="flex items-start justify-between gap-1 mb-1">
                    <div className="flex items-center gap-1.5 min-w-0">
                      <Building2 size={12} style={{ color: T.faint, flexShrink: 0 }} />
                      <span className="text-sm font-medium truncate" style={{ color: T.text }}>{c.company}</span>
                    </div>
                    <IconBtn onClick={() => removeApp(c.id)} title="Delete"><Trash2 size={12} /></IconBtn>
                  </div>
                  <div className="text-xs" style={{ color: T.muted }}>{c.role}</div>
                  <div className="flex items-center justify-between mt-2 text-xs lc-mono" style={{ color: T.faint }}>
                    <span>applied {fmtShort(c.appliedDate)}</span>
                    {c.followUpDate && <span style={{ color: T.amber }}>↻ {fmtShort(c.followUpDate)}</span>}
                  </div>
                  {stage !== "Closed" && (
                    <button
                      onClick={() => moveApp(c.id, STAGES[STAGES.indexOf(stage) + 1])}
                      className="mt-2 w-full flex items-center justify-center gap-1 text-xs py-1 rounded-md"
                      style={{ color: T.teal, background: T.tealDim }}
                    >
                      Advance <ArrowRight size={11} />
                    </button>
                  )}
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Notes                                                                   */
/* ---------------------------------------------------------------------- */

const NOTE_TYPES = { idea: T.violet, task: T.teal, note: T.muted, reminder: T.amber };

function NotesView({ data, update }) {
  const [text, setText] = useState("");
  const [type, setType] = useState("note");
  const [filter, setFilter] = useState("all");

  const addNote = () => {
    if (!text.trim()) return;
    update((d) => { d.notes.unshift({ id: uid(), text: text.trim(), type, createdAt: isoDate() }); return d; });
    setText("");
  };
  const removeNote = (id) => update((d) => { d.notes = d.notes.filter((n) => n.id !== id); return d; });

  const filtered = data.notes.filter((n) => filter === "all" || n.type === filter);

  return (
    <div className="max-w-3xl mx-auto flex flex-col gap-6">
      <ViewHeader title="Notes" subtitle={`${data.notes.length} captured`} />

      <Card style={{ padding: 20 }}>
        <div className="flex flex-col sm:flex-row gap-2">
          <TextInput placeholder="Capture a thought…" value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addNote()} />
          <Select value={type} onChange={(e) => setType(e.target.value)} options={[{ value: "note", label: "Note" }, { value: "idea", label: "Idea" }, { value: "reminder", label: "Reminder" }, { value: "task", label: "Task" }]} />
          <PrimaryButton onClick={addNote}><Plus size={15} /> Add</PrimaryButton>
        </div>
      </Card>

      <div className="flex gap-2 lc-scroll overflow-x-auto pb-1">
        {["all", "idea", "note", "reminder", "task"].map((f) => (
          <button key={f} onClick={() => setFilter(f)} className="px-3 py-1.5 rounded-lg text-sm capitalize flex-shrink-0" style={{ background: filter === f ? T.surfaceAlt : "transparent", color: filter === f ? T.teal : T.muted, border: `1px solid ${filter === f ? T.border : "transparent"}` }}>
            {f}
          </button>
        ))}
      </div>

      <Card>
        {filtered.length === 0 && <div className="p-6"><EmptyHint text="Nothing here yet. Capture your first thought above." /></div>}
        {filtered.map((n, i) => (
          <div key={n.id} className="flex items-start gap-3 px-4 py-3" style={{ borderTop: i === 0 ? "none" : `1px solid ${T.borderSoft}` }}>
            <span className="mt-1.5 w-2 h-2 rounded-full flex-shrink-0" style={{ background: NOTE_TYPES[n.type] }} />
            <div className="flex-1 min-w-0">
              <div className="text-sm" style={{ color: T.text }}>{n.text}</div>
              <div className="text-xs lc-mono mt-0.5 capitalize" style={{ color: T.faint }}>{n.type} · {fmtShort(n.createdAt)}</div>
            </div>
            <IconBtn onClick={() => removeNote(n.id)} title="Delete"><Trash2 size={14} /></IconBtn>
          </div>
        ))}
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Shared header                                                          */
/* ---------------------------------------------------------------------- */

function ViewHeader({ title, subtitle }) {
  return (
    <div>
      <h1 className="lc-display text-2xl font-semibold" style={{ color: T.text }}>{title}</h1>
      {subtitle && <p className="text-sm mt-1 lc-mono" style={{ color: T.faint }}>{subtitle}</p>}
    </div>
  );
}

/* Mount                                                                  */

const root = createRoot(document.getElementById("root"));
root.render(<LifeCommandCenter />);
</script>
