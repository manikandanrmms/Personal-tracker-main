/* Personal Tracker unified application */
.brand-mark{
  background:linear-gradient(135deg,#4d6ff3,#6b82f5)!important;
  border-radius:12px!important;
  font-size:17px;
}
.brand-name{display:flex;flex-direction:column;line-height:1.1}
.brand-name strong{font-size:15px;letter-spacing:-.02em}
.brand-name small{font-size:9px;color:#98a2b3;font-weight:600;margin-top:3px;letter-spacing:.04em}
.finance-frame-wrap{margin-top:22px;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#f5f8fc;box-shadow:var(--shadow)}
.finance-frame{display:block;width:100%;height:calc(100vh - 145px);min-height:720px;border:0;background:#f5f8fc}
@media(max-width:700px){
  .finance-frame-wrap{margin-top:14px}
  .finance-frame{height:calc(100vh - 160px);min-height:760px}
}


/* Top-level Personal Tracker / Finance switcher */
.module-switcher-wrap{
  position:sticky;top:0;z-index:20;
  display:flex;justify-content:center;
  padding:14px 0 12px;
  background:rgba(245,247,251,.94);
  backdrop-filter:blur(10px);
}
.module-switcher{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px;background:#fff;border:1px solid #e1e7f0;
  border-radius:12px;box-shadow:0 5px 18px rgba(31,49,83,.07);
}
.module-tab{
  border:0;background:transparent;color:#7a8698;
  padding:10px 22px;border-radius:9px;
  font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:8px;
  transition:.2s;
}
.module-tab:hover{background:#f7f9fd;color:#526176}
.module-tab.active{
  background:var(--primary);color:#fff;
  box-shadow:0 5px 13px rgba(77,111,243,.20);
}
.module-tab.finance.active{
  background:#202938;
  box-shadow:0 5px 13px rgba(32,41,56,.18);
}
.module-tab-icon{
  width:24px;height:24px;border-radius:7px;
  display:grid;place-items:center;
  background:rgba(77,111,243,.09);
  font-size:13px;
}
.module-tab.active .module-tab-icon{
  background:rgba(255,255,255,.18);color:#fff;
}
.finance-mode .module-switcher-wrap{
  background:#f5f7fb;
}
.finance-mode .sidebar{display:none}
.finance-mode .main{
  padding-left:20px;padding-right:20px;
}
.finance-mode .page-head{
  margin-left:-20px;margin-right:-20px;
}
.finance-mode #view{
  max-width:none;
}
.finance-mode .finance-frame-wrap{
  margin-top:0;
  border-radius:14px;
}
@media(max-width:700px){
  .module-switcher-wrap{padding:9px 0}
  .module-tab{padding:9px 14px;font-size:12px}
  .finance-mode .main{padding-left:10px;padding-right:10px}
  .finance-mode .page-head{margin-left:-10px;margin-right:-10px}
}

window.waitForCloud = function (timeoutMs) {
  timeoutMs = timeoutMs || 10000;
  return new Promise(function (resolve) {
    var started = Date.now();
    (function poll() {
      if (window.Cloud) return resolve(window.Cloud);
      if (Date.now() - started >= timeoutMs) return resolve(null);
      setTimeout(poll, 25);
    })();
  });
};

function greeting(){const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening"}
function updateHeader(){const el=document.getElementById("headerDate");if(el)el.textContent=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"})}

function tasks(){
 let arr=data.tasks.filter(t=>filter==="pending"?!t.done:filter==="done"?t.done:filter==="high"?(t.priority==="high"&&!t.done):true);
 const rows=arr.map(t=>`<div class="item"><button class="check ${t.done?"done":""}" data-task-toggle="${t.id}">${t.done?"✓":""}</button><span class="priority ${t.priority}"></span><div class="item-main"><div class="item-title ${t.done?"done":""}">${esc(t.title)}</div><div class="meta">${esc(t.category)}${t.dueDate?" · due "+fmt(t.dueDate):""}</div></div><button class="icon-btn" data-task-delete="${t.id}">✕</button></div>`).join("");
 return `${shell("Tasks",`${data.tasks.filter(t=>!t.done).length} pending · ${data.tasks.filter(t=>t.done).length} completed`)}
 <section class="card" style="margin-top:22px"><form class="form" id="taskForm"><input class="grow" id="taskTitle" placeholder="What needs doing?" required><select id="taskPriority"><option value="high">High priority</option><option value="medium" selected>Medium priority</option><option value="low">Low priority</option></select><input id="taskDue" type="date"><input id="taskCategory" placeholder="Category"><button class="btn">Add task</button></form></section>
 <div class="filters">${[["all","All"],["pending","Pending"],["high","High priority"],["done","Completed"]].map(x=>`<button class="filter ${filter===x[0]?"active":""}" data-filter="${x[0]}">${x[1]}</button>`).join("")}</div>
 <section class="card list">${rows||'<div class="empty">No tasks here. Add one above to get started.</div>'}</section>`;
}
function goals(){
 const rows=data.goals.map(g=>`<section class="card"><div class="row"><div><b>${esc(g.name)}</b><div class="meta">${esc(g.category)}</div></div><div><b style="color:var(--violet)">${g.progress}%</b><button class="icon-btn" data-goal-delete="${g.id}">✕</button></div></div><input class="range" data-goal-progress="${g.id}" type="range" min="0" max="100" value="${g.progress}" style="margin-top:14px"></section>`).join("");
 return `${shell("Goals",`${data.goals.length} tracked`)}<section class="card" style="margin-top:22px"><form class="form" id="goalForm"><input class="grow" id="goalName" placeholder="Goal name" required><input id="goalCategory" placeholder="Category"><button class="btn">Add goal</button></form></section><div class="stack" style="margin-top:18px">${rows||'<div class="empty">No goals yet.</div>'}</div>`;
}
function habits(){
  const last7=Array.from({length:7},(_,i)=>daysAgo(6-i));
  const completedToday=data.habits.filter(h=>h.doneDates.includes(today())).length;
  const totalChecks=data.habits.reduce((n,h)=>n+last7.filter(d=>h.doneDates.includes(d)).length,0);
  const consistency=Math.round(totalChecks/Math.max(1,data.habits.length*7)*100);
  const streaks=data.habits.map(h=>{let n=0,d=new Date();while(h.doneDates.includes(iso(d))){n++;d.setDate(d.getDate()-1)}return n});
  const currentStreak=Math.max(0,...streaks);
  const bestStreak=Math.max(currentStreak,...data.habits.map(h=>{let best=0,run=0;[...h.doneDates].sort().forEach((x,i,a)=>{run=i&&new Date(x)-new Date(a[i-1])===86400000?run+1:1;best=Math.max(best,run)});return best}));
  const suggestions=["Drink Water","Exercise","Meditate","Read","Sleep Early"];
  const rows=data.habits.map((h,idx)=>{
    const streak=streaks[idx],pct=Math.round(h.doneDates.filter(d=>last7.includes(d)).length/7*100);
    const description={Water:"Stay hydrated, stay healthy",Learning:"Learn something new every day",Exercise:"Move your body, improve your health",Meditation:"Calm mind, peaceful life"}[h.name]||"Small actions, consistent progress";
    const days=last7.map(d=>{
      const dayName=new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"short"}).slice(0,1);
      const on=h.doneDates.includes(d),isToday=d===today();
      return `<button class="week-dot ${on?"on":""} ${isToday?"today":""}" title="${on?"Completed":"Mark complete"} · ${fmt(d)}" data-habit-day="${h.id}|${d}">${on?"✓":dayName}</button>`;
    }).join("");
    return `<section class="habit-card"><div class="habit-icon-large">${esc(h.icon)}</div><div><div class="habit-name">${esc(h.name)}</div><div class="habit-description">${description}</div><div class="habit-streak">🔥 ${streak} day streak</div></div><div class="week-track">${days}</div><div class="habit-progress" style="--pct:${pct}%"><span>${pct}%</span></div><button class="icon-btn habit-menu" title="Delete habit" data-habit-delete="${h.id}">⋮</button></section>`;
  }).join("");
  return `<div class="habits-page"><div class="habits-top"><div>${shell("Habits","Build consistency, shape your life")}</div><div class="habits-tools"><input class="habit-search" id="habitSearch" placeholder="Search habits…"><button class="btn secondary" id="habitFilterBtn">☷</button><button class="btn" onclick="document.getElementById('habitName').focus()">＋ New Habit</button></div></div><div class="grid habit-stats"><section class="card habit-stat"><div class="habit-stat-icon">🎯</div><div class="habit-stat-value">${data.habits.length}</div><div class="habit-stat-label">Total Habits</div><small>Active habits</small></section><section class="card habit-stat"><div class="habit-stat-icon green">✓</div><div class="habit-stat-value">${completedToday}</div><div class="habit-stat-label">Completed Today</div><small>${Math.round(completedToday/Math.max(1,data.habits.length)*100)}% completed</small></section><section class="card habit-stat"><div class="habit-stat-icon orange">🔥</div><div class="habit-stat-value">${currentStreak}</div><div class="habit-stat-label">Current Streak</div><small>days in a row</small></section><section class="card habit-stat"><div class="habit-stat-icon violet">↗</div><div class="habit-stat-value">${bestStreak}</div><div class="habit-stat-label">Best Streak</div><small>personal best</small></section></div><section class="card habit-create"><form class="habit-create-main" id="habitForm"><div class="habit-create-icon">💧</div><input class="grow" id="habitName" placeholder="What habit do you want to build?" required><select id="habitIcon"><option>💧</option><option>📚</option><option>🏋️</option><option>🧠</option><option>⌨️</option><option>✨</option><option>🌱</option><option>🎯</option></select><button class="btn">＋ Add Habit</button></form><div class="habit-suggestions"><span>Popular:</span>${suggestions.map(s=>`<button type="button" class="habit-chip" data-habit-suggest="${s}">${s}</button>`).join("")}</div></section><div class="habit-list" id="habitList">${rows||'<section class="card habit-empty"><div style="font-size:30px">🌱</div><b>No habits yet</b><div class="empty">Create your first habit above.</div></section>'}</div><div class="habit-insight">✨ <span><b>Consistency is the key to success.</b> Small daily actions lead to big results.</span><span><b>${consistency}%</b> overall consistency</span></div></div>`;
}
function career(){
 const cols=stages.map(stage=>{
  const jobs=data.career.filter(c=>c.stage===stage);
  return `<div class="column" data-stage="${esc(stage)}"><div class="column-title"><span>${esc(stage)}</span><span>${jobs.length}</span></div>${jobs.map(c=>`<div class="job" draggable="true" data-job="${c.id}"><div class="row"><span class="job-company">${esc(c.company)}</span><button class="icon-btn" data-job-delete="${c.id}">✕</button></div><div class="job-role">${esc(c.role)}</div><div class="meta">applied ${fmt(c.appliedDate)}${c.followUpDate?" · ↻ "+fmt(c.followUpDate):""}</div>${stage!=="Closed"?`<button class="btn secondary" style="width:100%;margin-top:9px;padding:7px" data-advance="${c.id}">Advance →</button>`:""}</div>`).join("")}</div>`
 }).join("");
 return `${shell("Career",`${data.career.length} applications tracked`)}<section class="card" style="margin-top:22px"><form class="form" id="careerForm"><input class="grow" id="jobCompany" placeholder="Company" required><input class="grow" id="jobRole" placeholder="Role" required><input id="jobRecruiter" placeholder="Recruiter"><input id="jobFollow" type="date"><button class="btn">Add</button></form></section><div class="kanban" style="margin-top:18px">${cols}</div>`;
}
function notes(){

 }).join("");

}

function openMoneyFlow(){
  const frame=document.createElement("iframe");
  frame.id="moneyFrame";
  frame.className="finance-frame";
  frame.title="Personal Tracker Money";
  frame.src="finance.html";
  frame.loading="eager";
  frame.setAttribute("allow","clipboard-write");
  frame.addEventListener("load",()=>{
    try{
      const C=window.Cloud;
      const uid=C&&typeof C.getCurrentUid==="function"?C.getCurrentUid():null;
      const user=window.__firebaseUser;
      frame.contentWindow.postMessage({type:"firebase-auth-changed",uid:uid||null,email:user&&user.email||""},window.location.origin);
    }catch(_){ }
  });
  return frame;
}
function money(){
  return `${shell("Money","Budget, spending, savings and reminders")}<div class="finance-frame-wrap" id="moneyFrameWrap"></div>`;
}

function render(){
  nav();
  updateHeader();

  const app=document.getElementById("app");
  app.classList.toggle("finance-mode",module==="finance");
  const workspaceModule=document.getElementById("workspaceModule");
  if(workspaceModule) workspaceModule.textContent=module==="finance"?"Finance":"Personal Tracker";

  const v=document.getElementById("view");

  if(module==="finance"){
    v.innerHTML=money();
    const wrap=document.getElementById("moneyFrameWrap");
    if(wrap) wrap.appendChild(openMoneyFlow());
    return;
  }

  v.innerHTML=
    tab==="dashboard"?dashboard():
    tab==="tasks"?tasks():
    tab==="goals"?goals():
    tab==="habits"?habits():
    tab==="career"?career():
    notes();

  bind();
}

function bind(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.go){tab=b.dataset.go;render()}});
 document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
 document.querySelectorAll("[data-habit]").forEach(b=>b.onclick=()=>update(d=>{const h=d.habits.find(x=>x.id===b.dataset.habit);const t=today();h.doneDates=h.doneDates.includes(t)?h.doneDates.filter(x=>x!==t):[...h.doneDates,t];}));
 document.querySelectorAll("[data-task-toggle]").forEach(b=>b.onclick=()=>update(d=>{const t=d.tasks.find(x=>x.id===b.dataset.taskToggle);t.done=!t.done;t.completedAt=t.done?today():null}));
 document.querySelectorAll("[data-task-delete]").forEach(b=>b.onclick=()=>update(d=>{d.tasks=d.tasks.filter(x=>x.id!==b.dataset.taskDelete)}));
 document.querySelectorAll("[data-goal-delete]").forEach(b=>b.onclick=()=>update(d=>{d.goals=d.goals.filter(x=>x.id!==b.dataset.goalDelete)}));
 document.querySelectorAll("[data-goal-progress]").forEach(b=>b.oninput=()=>{const g=data.goals.find(x=>x.id===b.dataset.goalProgress);g.progress=Number(b.value);save()});
 document.querySelectorAll("[data-habit-day]").forEach(b=>b.onclick=()=>{const [id,dte]=b.dataset.habitDay.split("|");update(d=>{const h=d.habits.find(x=>x.id===id);h.doneDates=h.doneDates.includes(dte)?h.doneDates.filter(x=>x!==dte):[...h.doneDates,dte]})});
 document.querySelectorAll("[data-habit-delete]").forEach(b=>b.onclick=()=>update(d=>{d.habits=d.habits.filter(x=>x.id!==b.dataset.habitDelete)})); 
  document.querySelectorAll("[data-habit-suggest]").forEach(b=>b.onclick=()=>{const i=document.getElementById("habitName");if(i){i.value=b.dataset.habitSuggest;i.focus()}});
  const hs=document.getElementById("habitSearch");
  if(hs)hs.oninput=()=>{const q=hs.value.toLowerCase();document.querySelectorAll("#habitList .habit-card").forEach(c=>{c.style.display=c.querySelector(".habit-name").textContent.toLowerCase().includes(q)?"":"none"})};

 document.querySelectorAll("[data-note-delete]").forEach(b=>b.onclick=()=>update(d=>{d.notes=d.notes.filter(x=>x.id!==b.dataset.noteDelete)}));
 document.querySelectorAll("[data-job-delete]").forEach(b=>b.onclick=()=>update(d=>{d.career=d.career.filter(x=>x.id!==b.dataset.jobDelete)}));
 document.querySelectorAll("[data-advance]").forEach(b=>b.onclick=()=>update(d=>{const c=d.career.find(x=>x.id===b.dataset.advance);const i=stages.indexOf(c.stage);if(i<stages.length-1)c.stage=stages[i+1]}));
 document.querySelectorAll(".job[draggable=true]").forEach(j=>{j.ondragstart=()=>dragId=j.dataset.job});
 document.querySelectorAll(".column").forEach(c=>{
  c.ondragover=e=>{e.preventDefault();c.classList.add("dragover")};
  c.ondragleave=()=>c.classList.remove("dragover");
  c.ondrop=e=>{e.preventDefault();c.classList.remove("dragover");if(dragId){update(d=>{const x=d.career.find(x=>x.id===dragId);if(x)x.stage=c.dataset.stage});dragId=null}}
 });
 const f=document.getElementById("captureForm");
 if(f)f.onsubmit=e=>{e.preventDefault();const text=document.getElementById("captureText").value.trim(),type=document.getElementById("captureType").value;update(d=>{d.notes.unshift({id:uid(),text,type,createdAt:today()});if(type==="task")d.tasks.unshift({id:uid(),title:text,priority:"medium",done:false,dueDate:null,category:"Inbox",createdAt:today()})});notify("Captured")};
 const tf=document.getElementById("taskForm");
 if(tf)tf.onsubmit=e=>{e.preventDefault();update(d=>d.tasks.unshift({id:uid(),title:document.getElementById("taskTitle").value.trim(),priority:document.getElementById("taskPriority").value,done:false,dueDate:document.getElementById("taskDue").value||null,category:document.getElementById("taskCategory").value.trim()||"General",createdAt:today()}))};
 const gf=document.getElementById("goalForm");
 if(gf)gf.onsubmit=e=>{e.preventDefault();update(d=>d.goals.push({id:uid(),name:document.getElementById("goalName").value.trim(),category:document.getElementById("goalCategory").value.trim()||"General",progress:0}))};
 const hf=document.getElementById("habitForm");
 if(hf)hf.onsubmit=e=>{e.preventDefault();update(d=>d.habits.push({id:uid(),name:document.getElementById("habitName").value.trim(),icon:document.getElementById("habitIcon").value,doneDates:[]}))};
 const cf=document.getElementById("careerForm");
 if(cf)cf.onsubmit=e=>{e.preventDefault();update(d=>d.career.unshift({id:uid(),company:document.getElementById("jobCompany").value.trim(),role:document.getElementById("jobRole").value.trim(),appliedDate:today(),recruiter:document.getElementById("jobRecruiter").value.trim(),stage:"Wishlist",notes:"",followUpDate:document.getElementById("jobFollow").value||null}))};
 const nf=document.getElementById("noteForm");
 if(nf)nf.onsubmit=e=>{e.preventDefault();update(d=>d.notes.unshift({id:uid(),text:document.getElementById("noteText").value.trim(),type:document.getElementById("noteType").value,createdAt:today()}))};
}
render();
initPersonalCloud();
})();
</script>
