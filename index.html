<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0E13">
<meta name="description" content="Command Center — Life OS">
<title>Command Center — Life OS</title>
<style>
:root{
  --bg:#0A0E13;--surface:#12181F;--surface2:#1A222C;--border:#232C38;--border2:#1B232E;
  --text:#E7ECF2;--muted:#8492A3;--faint:#647184;--teal:#2FE0C4;--tealDim:#1B3B36;
  --amber:#F5A623;--amberDim:#3B2E14;--coral:#FB7185;--coralDim:#3A1E23;
  --green:#3DDC97;--violet:#A78BFA;--violetDim:#2A2340;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex;background:var(--bg)}
.sidebar{width:230px;flex:0 0 230px;background:var(--surface);border-right:1px solid var(--border);padding:24px 14px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 24px;font-weight:700;letter-spacing:-.02em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--tealDim);display:grid;place-items:center;color:var(--teal)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left;display:flex;align-items:center;gap:10px;font-weight:600}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.active{background:var(--surface2);color:var(--teal)}
.sync{margin-top:auto;border-top:1px solid var(--border2);padding:16px 10px 0;color:var(--faint);font-size:12px;display:flex;align-items:center;gap:8px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.main{flex:1;min-width:0;padding:30px}
.container{max-width:1180px;margin:auto}
.page-title{margin:0;font-size:30px;letter-spacing:-.035em}
.subtitle{color:var(--faint);font-size:13px;margin-top:6px}
.section-label{text-transform:uppercase;letter-spacing:.13em;color:var(--faint);font-size:11px;font-weight:700;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:20px}
.grid{display:grid;gap:18px}
.stats{grid-template-columns:repeat(3,1fr);margin-top:28px}
.stat{border:1px solid var(--border);background:var(--surface);border-radius:17px;padding:18px;text-align:left;color:var(--text)}
.stat:hover{transform:translateY(-1px);border-color:#344253}
.stat-value{font-size:30px;font-weight:700;letter-spacing:-.04em}
.stat-label{font-size:12px;color:var(--muted);margin-top:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.dashboard-grid{grid-template-columns:repeat(3,1fr);margin-top:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.goal{margin-top:14px}
.goal:first-child{margin-top:0}
.goal-name{font-size:13px}
.progress{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:7px}
.progress>i{display:block;height:100%;background:var(--violet);border-radius:99px}
.habit-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;border:0;background:transparent;color:var(--muted);text-align:left;width:100%}
.habit-row.done{background:var(--tealDim);color:var(--text)}
.iconbox{width:30px;height:30px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;color:var(--teal);flex:0 0 30px}
.capture{margin-top:18px}
.form{display:flex;gap:9px;flex-wrap:wrap}
input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 11px;outline:none}
input:focus,select:focus{border-color:#3b5265;box-shadow:0 0 0 2px rgba(47,224,196,.08)}
.grow{flex:1;min-width:180px}
.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--teal);color:#062622;font-weight:700}
.btn.secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.btn.danger{background:var(--coralDim);color:var(--coral)}
.filters{display:flex;gap:7px;overflow:auto;margin:18px 0 10px}
.filter{border:1px solid transparent;background:transparent;color:var(--muted);padding:8px 11px;border-radius:9px;white-space:nowrap}
.filter.active{background:var(--surface2);border-color:var(--border);color:var(--teal)}
.list{overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:13px 2px;border-top:1px solid var(--border2)}
.item:first-child{border-top:0}
.check{width:20px;height:20px;border-radius:6px;border:1px solid var(--border);background:transparent;color:#062622;display:grid;place-items:center;flex:0 0 20px}
.check.done{background:var(--green);border-color:var(--green)}
.item-main{flex:1;min-width:0}
.item-title{font-size:14px}
.item-title.done{text-decoration:line-through;color:var(--faint)}
.meta{font-size:11px;color:var(--faint);margin-top:3px}
.priority{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.priority.high{background:var(--coral)} .priority.medium{background:var(--amber)} .priority.low{background:var(--muted)}
.icon-btn{border:0;background:transparent;color:var(--faint);padding:7px;border-radius:7px}
.icon-btn:hover{color:var(--coral);background:var(--coralDim)}
.range{width:100%;accent-color:var(--violet)}
.habit-grid{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center}
.days{display:flex;gap:5px}
.day{width:29px;height:29px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--faint)}
.day.on{background:var(--tealDim);border-color:var(--teal);color:var(--teal)}
.kanban{display:flex;gap:12px;overflow:auto;padding-bottom:8px}
.column{min-width:245px;background:var(--surface2);border:1px solid var(--border2);border-radius:15px;padding:12px}
.column.dragover{outline:1px dashed var(--teal)}
.column-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:10px}
.job{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;margin-top:8px}
.job:first-child{margin-top:0}
.job[draggable=true]{cursor:grab}
.job-company{font-size:13px;font-weight:700}
.job-role{font-size:12px;color:var(--muted);margin-top:4px}
.note{display:flex;gap:10px;padding:13px 2px;border-top:1px solid var(--border2)}
.note:first-child{border-top:0}
.note-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 8px}
.empty{color:var(--faint);font-size:13px;padding:10px 0}
.analytics{margin-top:18px}
.bars{height:150px;display:flex;align-items:end;gap:10px;margin-top:12px}
.bar-wrap{height:100%;flex:1;display:flex;align-items:end;justify-content:center}
.bar{width:65%;max-width:36px;background:var(--teal);border-radius:5px 5px 0 0;min-height:2px}
.bar-label{font-size:10px;color:var(--faint);margin-top:6px;text-align:center}
.analytics-inner{display:grid;grid-template-columns:2fr 1fr;gap:25px}
.metrics{display:flex;flex-direction:column;justify-content:center;gap:18px}
.mobile-menu{display:none}
.toast{position:fixed;right:18px;bottom:18px;background:var(--surface2);border:1px solid var(--border);padding:10px 14px;border-radius:10px;color:var(--text);font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:900px){
 .sidebar{width:190px;flex-basis:190px}
 .dashboard-grid{grid-template-columns:1fr}
 .analytics-inner{grid-template-columns:1fr}
}
@media(max-width:700px){
 .app{display:block}
 .sidebar{width:100%;height:auto;padding:10px;display:block;border-right:0;border-bottom:1px solid var(--border)}
 .brand{display:none}
 .nav{flex-direction:row;overflow:auto}
 .nav button{white-space:nowrap}
 .sync{display:none}
 .main{padding:18px 12px}
 .stats{grid-template-columns:1fr 1fr 1fr;gap:7px}
 .stat{padding:12px 9px}
 .stat-value{font-size:22px}
 .stat-label{font-size:10px}
 .page-title{font-size:25px}
 .habit-grid{grid-template-columns:1fr auto}
 .habit-grid>.days{grid-column:1/-1;overflow:auto}
}
</style>
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">✦</span><span>Command Center</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="sync"><span class="sync-dot" id="syncDot"></span><span id="syncText">Ready</span></div>
  </aside>
  <main class="main"><div class="container" id="view"></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

const KEY="lifeos:standalone:v2";
const stages=["Wishlist","Applied","Screening","Interview","Final Round","Offer","Closed"];
const navItems=[
  ["dashboard","⌂","Dashboard"],["tasks","✓","Tasks"],["goals","◎","Goals"],
  ["habits","🔥","Habits"],["career","▣","Career"],["notes","▤","Notes"]
];
let tab="dashboard", filter="all", dragId=null, toastTimer=null;

const uid=()=>Math.random().toString(36).slice(2,10);
const iso=(d=new Date())=>{const x=new Date(d);return x.toISOString().slice(0,10)};
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const fmt=s=>s?new Date(s+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}):"";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const today=()=>iso();

function defaults(){
 const t0=daysAgo(0),t1=daysAgo(1),t2=daysAgo(2);
 return {
  tasks:[
   {id:uid(),title:"Finish dashboard mockups",priority:"high",done:false,dueDate:daysAgo(-1),category:"Projects",createdAt:t2},
   {id:uid(),title:"Reply to recruiter email",priority:"high",done:false,dueDate:t0,category:"Career",createdAt:t2},
   {id:uid(),title:"Read two chapters",priority:"medium",done:false,dueDate:daysAgo(-2),category:"Learning",createdAt:t1},
   {id:uid(),title:"Grocery run",priority:"low",done:false,dueDate:null,category:"Personal",createdAt:t1},
   {id:uid(),title:"Set up project repo",priority:"medium",done:true,dueDate:null,category:"Projects",createdAt:t2,completedAt:t1},
   {id:uid(),title:"Morning workout",priority:"low",done:true,dueDate:null,category:"Health",createdAt:t0,completedAt:t0},
   {id:uid(),title:"Plan the week",priority:"medium",done:true,dueDate:null,category:"Personal",createdAt:t0,completedAt:t0}
  ],
  goals:[
   {id:uid(),name:"Land a new role",category:"Career",progress:72},
   {id:uid(),name:"Ship the Life OS build",category:"Personal Projects",progress:58},
   {id:uid(),name:"Finish the systems design course",category:"Learning",progress:41}
  ],
  habits:[
   {id:uid(),name:"Water",icon:"💧",doneDates:[t0,t1,t2]},
   {id:uid(),name:"Learning",icon:"📚",doneDates:[t0,t2]},
   {id:uid(),name:"Exercise",icon:"🏋️",doneDates:[t0,t1]},
   {id:uid(),name:"Meditation",icon:"🧠",doneDates:[t1]},
   {id:uid(),name:"Project work",icon:"⌨️",doneDates:[t0,t1,t2]}
  ],
  career:[
   {id:uid(),company:"Nimbus Analytics",role:"Frontend Engineer",appliedDate:daysAgo(10),recruiter:"Priya Menon",stage:"Interview",notes:"Second round scheduled.",followUpDate:daysAgo(-3)},
   {id:uid(),company:"Fieldstone",role:"Product Designer",appliedDate:daysAgo(18),recruiter:"",stage:"Applied",notes:"",followUpDate:daysAgo(-1)},
   {id:uid(),company:"Kestrel Labs",role:"Full Stack Developer",appliedDate:daysAgo(4),recruiter:"Sam O.",stage:"Screening",notes:"Phone screen went well.",followUpDate:null},
   {id:uid(),company:"Willow & Co",role:"UX Engineer",appliedDate:daysAgo(30),recruiter:"",stage:"Wishlist",notes:"Dream company, wait for referral.",followUpDate:null},
   {id:uid(),company:"Anchorpoint",role:"Software Engineer",appliedDate:daysAgo(25),recruiter:"Dana K.",stage:"Closed",notes:"Went with another candidate.",followUpDate:null}
  ],
  notes:[
   {id:uid(),text:"Idea: weekly review ritual every Sunday evening",type:"idea",createdAt:t1},
   {id:uid(),text:"Ask about relocation policy at Nimbus",type:"reminder",createdAt:t0},
   {id:uid(),text:"Book recommendation from Dana: Designing Data-Intensive Applications",type:"note",createdAt:t2}
  ]
 };
}
function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY));
  return x && x.tasks && x.goals && x.habits && x.career && x.notes ? x : defaults();
 }catch(e){return defaults()}
}
let data=load();

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(data));
  document.getElementById("syncText").textContent="Saved locally";
 }catch(e){
  document.getElementById("syncText").textContent="Storage unavailable";
 }
}
function notify(msg){
 const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1600);
}
function update(fn){fn(data);save();render()}

function nav(){
 document.getElementById("nav").innerHTML=navItems.map(([id,icon,label])=>
  `<button class="${tab===id?"active":""}" data-tab="${id}"><span>${icon}</span>${label}</button>`).join("");
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;filter="all";render()});
}
function shell(title,sub){
 return `<div><h1 class="page-title">${title}</h1><div class="subtitle">${sub||""}</div></div>`;
}
function stat(value,label,color,id){
 return `<button class="stat" data-go="${id||""}"><div class="stat-value"><span class="dot" style="background:${color}"></span>${value}</div><div class="stat-label">${label}</div></button>`;
}
function dashboard(){
 const hp=data.tasks.filter(t=>!t.done&&t.priority==="high").length;
 const pending=data.tasks.filter(t=>!t.done&&t.priority!=="high").length;
 const completed=data.tasks.filter(t=>t.done&&t.completedAt===today()).length;
 const avg=Math.round(data.goals.reduce((a,g)=>a+Number(g.progress),0)/Math.max(1,data.goals.length));
 const last7=Array.from({length:7},(_,i)=>daysAgo(6-i));
 const consistency=Math.round(data.habits.reduce((sum,h)=>sum+last7.filter(d=>h.doneDates.includes(d)).length,0)/Math.max(1,data.habits.length*7)*100);
 const upcoming=[...data.tasks.filter(t=>!t.done&&t.dueDate).map(t=>({label:t.title,date:t.dueDate,kind:"Task"})),
  ...data.career.filter(c=>c.followUpDate).map(c=>({label:"Follow up — "+c.company,date:c.followUpDate,kind:"Career"}))]
  .sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
 const goals=data.goals.map(g=>`<div class="goal"><div class="row"><span class="goal-name">${esc(g.name)}</span><span class="meta">${g.progress}%</span></div><div class="progress"><i style="width:${Math.max(0,Math.min(100,g.progress))}%"></i></div></div>`).join("");
 const habits=data.habits.map(h=>{
  const on=h.doneDates.includes(today());
  return `<button class="habit-row ${on?"done":""}" data-habit="${h.id}"><span class="iconbox">${esc(h.icon)}</span><span>${esc(h.name)}</span><span style="margin-left:auto">${on?"✓":""}</span></button>`
 }).join("");
 const upcomingHtml=upcoming.length?upcoming.map(u=>`<div class="row"><span style="font-size:13px">${esc(u.label)}</span><span class="meta">${fmt(u.date)}</span></div>`).join(""):`<div class="empty">Nothing scheduled.</div>`;
 const bars=last7.map(d=>{
   const n=data.tasks.filter(t=>t.done&&t.completedAt===d).length;
   const h=Math.min(100,n*24);
   return `<div class="bar-wrap"><div><div class="bar" style="height:${Math.max(2,h)}px"></div><div class="bar-label">${new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"short"}).slice(0,2)}</div></div></div>`
 }).join("");
 return `${shell(greeting()+ " 👋",new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))}
 <div class="grid stats">${stat(hp,"High priority","var(--coral)","tasks")}${stat(pending,"Pending","var(--amber)","tasks")}${stat(completed,"Completed today","var(--green)","tasks")}</div>
 <div class="grid dashboard-grid">
  <section class="card"><div class="section-label">My goals <span style="float:right">avg ${avg}%</span></div>${goals||'<div class="empty">No goals yet.</div>'}</section>
  <section class="card"><div class="section-label">Habits today <span style="float:right">${consistency}% this week</span></div><div class="stack">${habits}</div></section>
  <section class="card"><div class="section-label">Upcoming</div><div class="stack">${upcomingHtml}</div></section>
 </div>
 <section class="card capture"><div class="section-label">Quick capture</div><form class="form" id="captureForm"><input class="grow" id="captureText" placeholder="Add an idea, task, note, or reminder…" required><select id="captureType"><option>idea</option><option>task</option><option>note</option><option>reminder</option></select><button class="btn">Add</button></form></section>
 <section class="card analytics"><div class="section-label">Weekly analytics</div><div class="analytics-inner"><div class="bars">${bars}</div><div class="metrics"><div class="row"><span class="meta">Tasks completed</span><b>${last7.reduce((a,d)=>a+data.tasks.filter(t=>t.done&&t.completedAt===d).length,0)}</b></div><div class="row"><span class="meta">Habit consistency</span><b>${consistency}%</b></div><div class="row"><span class="meta">Avg. goal progress</span><b>${avg}%</b></div></div></div></section>`;
}
function greeting(){const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening"}

function tasks(){
 let arr=data.tasks.filter(t=>filter==="pending"?!t.done:filter==="done"?t.done:filter==="high"?(t.priority==="high"&&!t.done):true);
 const rows=arr.map(t=>`<div class="item"><button class="check ${t.done?"done":""}" data-task-toggle="${t.id}">${t.done?"✓":""}</button><span class="priority ${t.priority}"></span><div class="item-main"><div class="item-title ${t.done?"done":""}">${esc(t.title)}</div><div class="meta">${esc(t.category)}${t.dueDate?" · due "+fmt(t.dueDate):""}</div></div><button class="icon-btn" data-task-delete="${t.id}">✕</button></div>`).join("");
 return `${shell("Tasks",`${data.tasks.filter(t=>!t.done).length} pending · ${data.tasks.filter(t=>t.done).length} completed`)}
 <section class="card" style="margin-top:22px"><form class="form" id="taskForm"><input class="grow" id="taskTitle" placeholder="What needs doing?" required><select id="taskPriority"><option value="high">High priority</option><option value="medium" selected>Medium priority</option><option value="low">Low priority</option></select><input id="taskDue" type="date"><input id="taskCategory" placeholder="Category"><button class="btn">Add task</button></form></section>
 <div class="filters">${[["all","All"],["pending","Pending"],["high","High priority"],["done","Completed"]].map(x=>`<button class="filter ${filter===x[0]?"active":""}" data-filter="${x[0]}">${x[1]}</button>`).join("")}</div>
 <section class="card list">${rows||'<div class="empty">No tasks here. Add one above to get started.</div>'}</section>`;
}
function goals(){
 const rows=data.goals.map(g=>`<section class="card"><div class="row"><div><b>${esc(g.name)}</b><div class="meta">${esc(g.category)}</div></div><div><b style="color:var(--violet)">${g.progress}%</b><button class="icon-btn" data-goal-delete="${g.id}">✕</button></div></div><input class="range" data-goal-progress="${g.id}" type="range" min="0" max="100" value="${g.progress}" style="margin-top:14px"></section>`).join("");
 return `${shell("Goals",`${data.goals.length} tracked`)}<section class="card" style="margin-top:22px"><form class="form" id="goalForm"><input class="grow" id="goalName" placeholder="Goal name" required><input id="goalCategory" placeholder="Category"><button class="btn">Add goal</button></form></section><div class="stack" style="margin-top:18px">${rows||'<div class="empty">No goals yet.</div>'}</div>`;
}
function habits(){
 const last7=Array.from({length:7},(_,i)=>daysAgo(6-i));
 const rows=data.habits.map(h=>{
  const streak=(()=>{let n=0,d=new Date();while(h.doneDates.includes(iso(d))){n++;d.setDate(d.getDate()-1)}return n})();
  return `<section class="card habit-grid"><div class="row"><span class="iconbox">${esc(h.icon)}</span><div><b>${esc(h.name)}</b><div class="meta">🔥 ${streak} day streak</div></div></div><div class="days">${last7.map(d=>`<button class="day ${h.doneDates.includes(d)?"on":""}" data-habit-day="${h.id}|${d}">${new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"short"}).slice(0,1)}</button>`).join("")}</div><button class="icon-btn" data-habit-delete="${h.id}">✕</button></section>`
 }).join("");
 return `${shell("Habits",`${data.habits.length} tracked`)}<section class="card" style="margin-top:22px"><form class="form" id="habitForm"><input class="grow" id="habitName" placeholder="New habit name" required><select id="habitIcon"><option>💧</option><option>📚</option><option>🏋️</option><option>🧠</option><option>⌨️</option><option>✨</option></select><button class="btn">Add habit</button></form></section><div class="stack" style="margin-top:18px">${rows||'<div class="empty">No habits yet.</div>'}</div>`;
}
function career(){
 const cols=stages.map(stage=>{
  const jobs=data.career.filter(c=>c.stage===stage);
  return `<div class="column" data-stage="${esc(stage)}"><div class="column-title"><span>${esc(stage)}</span><span>${jobs.length}</span></div>${jobs.map(c=>`<div class="job" draggable="true" data-job="${c.id}"><div class="row"><span class="job-company">${esc(c.company)}</span><button class="icon-btn" data-job-delete="${c.id}">✕</button></div><div class="job-role">${esc(c.role)}</div><div class="meta">applied ${fmt(c.appliedDate)}${c.followUpDate?" · ↻ "+fmt(c.followUpDate):""}</div>${stage!=="Closed"?`<button class="btn secondary" style="width:100%;margin-top:9px;padding:7px" data-advance="${c.id}">Advance →</button>`:""}</div>`).join("")}</div>`
 }).join("");
 return `${shell("Career",`${data.career.length} applications tracked`)}<section class="card" style="margin-top:22px"><form class="form" id="careerForm"><input class="grow" id="jobCompany" placeholder="Company" required><input class="grow" id="jobRole" placeholder="Role" required><input id="jobRecruiter" placeholder="Recruiter"><input id="jobFollow" type="date"><button class="btn">Add</button></form></section><div class="kanban" style="margin-top:18px">${cols}</div>`;
}
function notes(){
 const rows=data.notes.filter(n=>filter==="all"||n.type===filter).map(n=>{
  const c={idea:"var(--violet)",task:"var(--teal)",note:"var(--muted)",reminder:"var(--amber)"}[n.type]||"var(--muted)";
  return `<div class="note"><span class="note-dot" style="background:${c}"></span><div style="flex:1"><div style="font-size:14px">${esc(n.text)}</div><div class="meta">${esc(n.type)} · ${fmt(n.createdAt)}</div></div><button class="icon-btn" data-note-delete="${n.id}">✕</button></div>`
 }).join("");
 return `${shell("Notes",`${data.notes.length} captured`)}<section class="card" style="margin-top:22px"><form class="form" id="noteForm"><input class="grow" id="noteText" placeholder="Capture a thought…" required><select id="noteType"><option>note</option><option>idea</option><option>reminder</option><option>task</option></select><button class="btn">Add</button></form></section><div class="filters">${["all","idea","note","reminder","task"].map(x=>`<button class="filter ${filter===x?"active":""}" data-filter="${x}">${x}</button>`).join("")}</div><section class="card">${rows||'<div class="empty">Nothing here yet.</div>'}</section>`;
}

function render(){
 nav();
 const v=document.getElementById("view");
 v.innerHTML=tab==="dashboard"?dashboard():tab==="tasks"?tasks():tab==="goals"?goals():tab==="habits"?habits():tab==="career"?career():notes();
 bind();
}
function bind(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.go){tab=b.dataset.go;render()}});
 document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
 document.querySelectorAll("[data-habit]").forEach(b=>b.onclick=()=>update(d=>{const h=d.habits.find(x=>x.id===b.dataset.habit);const t=today();h.doneDates=h.doneDates.includes(t)?h.doneDates.filter(x=>x!==t):[...h.doneDates,t];}));
 document.querySelectorAll("[data-task-toggle]").forEach(b=>b.onclick=()=>update(d=>{const t=d.tasks.find(x=>x.id===b.dataset.taskToggle);t.done=!t.done;t.completedAt=t.done?today():null}));
 document.querySelectorAll("[data-task-delete]").forEach(b=>b.onclick=()=>update(d=>{d.tasks=d.tasks.filter(x=>x.id!==b.dataset.taskDelete)}));
 document.querySelectorAll("[data-goal-delete]").forEach(b=>b.onclick=()=>update(d=>{d.goals=d.goals.filter(x=>x.id!==b.dataset.goalDelete)}));
 document.querySelectorAll("[data-goal-progress]").forEach(b=>b.oninput=()=>{const g=data.goals.find(x=>x.id===b.dataset.goalProgress);g.progress=Number(b.value);save()});
 document.querySelectorAll("[data-habit-day]").forEach(b=>b.onclick=()=>{const [id,dte]=b.dataset.habitDay.split("|");update(d=>{const h=d.habits.find(x=>x.id===id);h.doneDates=h.doneDates.includes(dte)?h.doneDates.filter(x=>x!==dte):[...h.doneDates,dte]})});
 document.querySelectorAll("[data-habit-delete]").forEach(b=>b.onclick=()=>update(d=>{d.habits=d.habits.filter(x=>x.id!==b.dataset.habitDelete)}));
 document.querySelectorAll("[data-note-delete]").forEach(b=>b.onclick=()=>update(d=>{d.notes=d.notes.filter(x=>x.id!==b.dataset.noteDelete)}));
 document.querySelectorAll("[data-job-delete]").forEach(b=>b.onclick=()=>update(d=>{d.career=d.career.filter(x=>x.id!==b.dataset.jobDelete)}));
 document.querySelectorAll("[data-advance]").forEach(b=>b.onclick=()=>update(d=>{const c=d.career.find(x=>x.id===b.dataset.advance);const i=stages.indexOf(c.stage);if(i<stages.length-1)c.stage=stages[i+1]}));
 document.querySelectorAll(".job[draggable=true]").forEach(j=>{j.ondragstart=()=>dragId=j.dataset.job});
 document.querySelectorAll(".column").forEach(c=>{
  c.ondragover=e=>{e.preventDefault();c.classList.add("dragover")};
  c.ondragleave=()=>c.classList.remove("dragover");
  c.ondrop=e=>{e.preventDefault();c.classList.remove("dragover");if(dragId){update(d=>{const x=d.career.find(x=>x.id===dragId);if(x)x.stage=c.dataset.stage});dragId=null}}
 });
 const f=document.getElementById("captureForm");
 if(f)f.onsubmit=e=>{e.preventDefault();const text=document.getElementById("captureText").value.trim(),type=document.getElementById("captureType").value;update(d=>{d.notes.unshift({id:uid(),text,type,createdAt:today()});if(type==="task")d.tasks.unshift({id:uid(),title:text,priority:"medium",done:false,dueDate:null,category:"Inbox",createdAt:today()})});notify("Captured")};
 const tf=document.getElementById("taskForm");
 if(tf)tf.onsubmit=e=>{e.preventDefault();update(d=>d.tasks.unshift({id:uid(),title:document.getElementById("taskTitle").value.trim(),priority:document.getElementById("taskPriority").value,done:false,dueDate:document.getElementById("taskDue").value||null,category:document.getElementById("taskCategory").value.trim()||"General",createdAt:today()}))};
 const gf=document.getElementById("goalForm");
 if(gf)gf.onsubmit=e=>{e.preventDefault();update(d=>d.goals.push({id:uid(),name:document.getElementById("goalName").value.trim(),category:document.getElementById("goalCategory").value.trim()||"General",progress:0}))};
 const hf=document.getElementById("habitForm");
 if(hf)hf.onsubmit=e=>{e.preventDefault();update(d=>d.habits.push({id:uid(),name:document.getElementById("habitName").value.trim(),icon:document.getElementById("habitIcon").value,doneDates:[]}))};
 const cf=document.getElementById("careerForm");
 if(cf)cf.onsubmit=e=>{e.preventDefault();update(d=>d.career.unshift({id:uid(),company:document.getElementById("jobCompany").value.trim(),role:document.getElementById("jobRole").value.trim(),appliedDate:today(),recruiter:document.getElementById("jobRecruiter").value.trim(),stage:"Wishlist",notes:"",followUpDate:document.getElementById("jobFollow").value||null}))};
 const nf=document.getElementById("noteForm");
 if(nf)nf.onsubmit=e=>{e.preventDefault();update(d=>d.notes.unshift({id:uid(),text:document.getElementById("noteText").value.trim(),type:document.getElementById("noteType").value,createdAt:today()}))};
}
render();
})();
</script>
</body>
</html>
